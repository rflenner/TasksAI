/* Shell */
.shell { display: flex; min-height: 100vh; }
.side { position: fixed; inset: 0 auto 0 0; width: 246px; background: #fff; border-right: 1px solid var(--line); padding: 34px 22px; display: flex; flex-direction: column; }
.logo { font-size: 32px; font-weight: 800; color: var(--navy); padding: 0 15px 38px; }
.logo b { font-size: 20px; background: var(--orange); color: #fff; padding: 7px 6px; border-radius: 5px; margin-left: 4px; vertical-align: 5px; }
.side nav { display: grid; gap: 7px; align-content: start; }

.main { margin-left: 246px; flex: 1; min-width: 0; }
.content { max-width: 1420px; margin: auto; padding: 40px 42px 80px; }

/* Shared (buyer) header */

/* Page title */

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }

/* Phase timeline */

/* Filter bar (Task AI dimension bar) */

/* Two columns */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 26px; align-items: start; }

/* Phase groups */

.group.complete .group-title .avatar { background: #e4f4eb; color: var(--green); }
.group-title h2 { font-size: 15px; color: var(--dark); margin: 0 0 2px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.group-title small { color: #9097a1; display: block; }
.group-title .gt-right { margin-left: auto; text-align: right; font-size: 11px; color: #9097a1; white-space: nowrap; }
.pbar { width: 110px; height: 5px; border-radius: 5px; background: #e4eaf1; overflow: hidden; margin: 5px 0 0 auto; }
.pbar i { display: block; height: 100%; background: var(--green); }
.cur-tag { background: var(--navy); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .4px; border-radius: 999px; padding: 3px 9px; }

.cards { display: grid; gap: 9px; }
.card { width: 100%; min-width: 0; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 14px 20px 13px; display: flex; gap: 16px; align-items: flex-start; cursor: pointer; }
.card-check { width: 22px; height: 22px; margin: 1px 0 0; flex: none; appearance: none; -webkit-appearance: none; border: 2px solid #c3cbd6; border-radius: 6px; background: #fff; display: grid; place-items: center; cursor: pointer; }
.card-check:hover { border-color: var(--navy); }

.card { position: relative; }

.grip:hover { color: var(--navy); background: #eef3fa; }

.cards.drop-end { outline: 2px dashed #b8cce4; outline-offset: 4px; border-radius: 10px; }
.card:hover { border-color: #b8c6da; box-shadow: 0 5px 18px #173f7610; }
.card.active { border-color: var(--navy); background: #eef3fa; }
.card .avatar { width: 34px; height: 34px; font-size: 11px; }
.card-body { min-width: 0; flex: 1; }
.card-head { display: flex; gap: 10px; min-width: 0; align-items: center; }

.status { margin-left: auto; white-space: nowrap; border-radius: 12px; padding: 4px 8px; font-size: 10px; font-weight: 700; background: #f3f4f6; color: #5d6470; border: 0; }

.badge-new { flex: none; background: var(--navy); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .4px; border-radius: 999px; padding: 4px 10px; line-height: 1.4; }

.tags span.internal { background: #fff7e8; color: #9a5a00; border-color: #fde2b0; }

.meta { display: flex; flex-wrap: wrap; gap: 18px; color: #7e858f; font-size: 11px; align-items: center; }

.inline-new { cursor: default; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(23, 63, 118, .08); }

/* Drawer (Task AI) */
.overlay { position: fixed; inset: 0; background: #17223466; display: flex; justify-content: flex-end; z-index: 30; }
.drawer { width: var(--drawer-w); height: 100%; overflow: auto; background: #fff; padding: 42px; position: relative; box-shadow: -12px 0 40px #17223422; padding-top: calc(42px + env(safe-area-inset-top, 0px)); }
.x { position: absolute; right: 28px; top: calc(28px + env(safe-area-inset-top, 0px)); border: 0; background: #f1f3f6; border-radius: 50%; width: 36px; height: 36px; font-size: 23px; color: #58616e; line-height: 1; }

.switch { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 400; color: var(--ink); padding: 11px 0; }

.perm { margin: 0 0 18px; padding: 10px 12px; border-left: 3px solid var(--orange); border-radius: 0 6px 6px 0; background: #fff7e8; font-size: 12.5px; color: #4a5160; }
.section { padding-top: 22px; margin-top: 22px; border-top: 1px solid var(--line); }
.section h3 { font-size: 15px; color: var(--dark); margin: 0 0 10px; display: flex; gap: 8px; align-items: center; }

.checklist-item { display: flex; align-items: center; gap: 10px; padding: 5px 0; }

.sub-add { display: flex; gap: 8px; margin-top: 6px; }

.update { display: flex; gap: 10px; margin: 15px 0; }
.update .avatar { width: 30px; height: 30px; font-size: 10px; }

.notify-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.notify-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.notify-list .role { font-size: 10px; font-weight: 700; color: var(--navy); background: #eef4fc; border-radius: 10px; padding: 2px 7px; margin-left: 4px; }

.po { white-space: nowrap; display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: .4px; background: var(--orange); color: #fff; border-radius: 999px; padding: 2px 6px; vertical-align: 2px; margin-left: 4px; }

  const startMs = Math.min(...phases.map(p => d(p.start).getTime()), ...ms.map(t => d(t.due).getTime())) - 3 * 864e5;
  const endMs = Math.max(...phases.map(p => d(p.end).getTime()), ...ms.map(t => d(t.due).getTime())) + 4 * 864e5;
  const pct = ms => (ms - startMs) / (endMs - startMs) * 100;
  const months = [];
  const m = new Date(startMs); m.setDate(1); m.setMonth(m.getMonth() + 1);
  for (; m.getTime() < endMs; m.setMonth(m.getMonth() + 1)) months.push({ left: pct(m.getTime()), label: m.toLocaleDateString("en-GB", { month: "short" }) + (m.getMonth() === 0 ? ` ${m.getFullYear()}` : "") });
  const todayPos = pct(TODAY.getTime());
  const showToday = todayPos >= 0 && todayPos <= 100;
  const axis = `<div class="g-row g-axis ${overlapping() ? "" : "single"}">${overlapping() ? "<span></span>" : ""}<div class="g-lane">${months.map(mo => `<span class="g-month" style="left:${mo.left}%">${mo.label}</span>`).join("")}${showToday ? `<span class="g-today-label" style="left:${todayPos}%">TODAY</span>` : ""}</div></div>`;
  const grid = `${months.map(mo => `<i class="g-grid" style="left:${mo.left}%"></i>`).join("")}${showToday ? `<i class="g-today" style="left:${todayPos}%"></i>` : ""}`;
  // Milestone diamonds; hovering (or focusing) one shows its name, date and any recent date change.
  const msLane = ms.length ? `<div class="g-lane g-lane-ms">${grid}${ms.map(t => {
    const mv = recentMove(t), x = pct(d(t.due).getTime() + 432e5), st = t.status === "Closed" ? "done" : isOver(t) ? "late" : "";
    const edge = x < 18 ? "tip-left" : x > 82 ? "tip-right" : "";
    return `<button type="button" class="ms-mark ${st} ${mv ? "moved" : ""}" data-kd="${t.id}" style="left:${x}%" aria-label="Milestone ${esc(t.title)}, ${fmtY(t.due)}${mv ? `, moved ${shiftText(mv)}` : ""}"><i class="ms-dot"></i>
      <span class="ms-tip ${edge}" role="tooltip"><span class="kd ${st}"><i class="ms-dot"></i><span class="kd-name">${esc(t.title)}</span><span class="kd-date">${t.status === "Closed" ? "Done" : isOver(t) ? `Overdue · ${fmt(t.due)}` : fmtY(t.due)}</span>${mv ? `<span class="kd-moved">moved ${shiftText(mv)}</span>` : ""}</span>${mv ? `<span class="ms-tip-sub">From ${fmt(mv.from)} · changed by ${esc(person(mv.by).name)} on ${fmt(mv.at)}</span>` : ""}</span></button>`;
  }).join("")}</div>` : "";
  const doneOf = ph => { const ts = state.tasks.filter(t => t.phase === ph.id && visible(t)); return ts.length ? ts.filter(t => t.status === "Closed").length / ts.length : 0; };
  // No overlaps: one compact lane, every phase placed by date with its name inside the bar.
  if (!overlapping()) {
    const bars = phases.map((ph, i) => {
      const done = doneOf(ph), left = pct(d(ph.start).getTime()), width = pct(d(ph.end).getTime() + 864e5) - left;
      return `<button type="button" class="g-bar g-strip ${isCurrent(ph) ? "current" : ""}" data-jump="${ph.id}" style="left:${left}%;width:${width}%" title="${esc(ph.name)}: ${fmtY(ph.start)} – ${fmtY(ph.end)}, ${Math.round(done * 100)}% closed">
        <i class="g-fill" style="width:${done * 100}%"></i><span class="nm"><span class="g-num">${i + 1}</span>${esc(ph.name)}</span><span class="dt">${fmt(ph.start)} – ${fmt(ph.end)}</span></button>`;
    }).join("");
    return `<section class="timeline" aria-label="Phase timeline">${axis}<div class="g-row single"><div class="g-lane g-lane-strip">${grid}${bars}</div></div>${msLane ? `<div class="g-row single">${msLane}</div>` : ""}</section>`;
  }
  const rows = phases.map((ph, i) => {
    const ts = state.tasks.filter(t => t.phase === ph.id && visible(t));
    const done = ts.length ? ts.filter(t => t.status === "Closed").length / ts.length : 0;
    const left = pct(d(ph.start).getTime()), width = Math.max(pct(d(ph.end).getTime() + 864e5) - left, 1.5);
    return `<div class="g-row">
      <button type="button" class="g-label" data-jump="${ph.id}"><span class="g-num">${i + 1}</span>${esc(ph.name)}</button>
      <div class="g-lane">${grid}
        <button type="button" class="g-bar ${isCurrent(ph) ? "current" : ""}" data-jump="${ph.id}" style="left:${left}%;width:${width}%" title="${esc(ph.name)}: ${fmtY(ph.start)} – ${fmtY(ph.end)}, ${Math.round(done * 100)}% closed">
          <i class="g-fill" style="width:${done * 100}%"></i>${width >= 18 ? `<span>${fmt(ph.start)} – ${fmt(ph.end)}</span>` : ""}</button>
        ${width < 18 ? `<span class="g-out" style="left:calc(${left + width}% + 6px)">${fmt(ph.start)} – ${fmt(ph.end)}</span>` : ""}
      </div>
    </div>`;
  }).join("");
  return `<section class="timeline" aria-label="Phase timeline">
    ${axis}
    ${rows}
    ${msLane ? `<div class="g-row"><span class="g-label g-ms-label"><i class="ms-dot"></i>Milestones</span>${msLane}</div>` : ""}
  </section>`;
}

function phaseEditForm(ph) {
  const isNew = !ph;
  const p = ph || { id: "new", name: "", goal: "", start: TODAY.toISOString().slice(0, 10), end: TODAY.toISOString().slice(0, 10) };
  const count = isNew ? 0 : state.tasks.filter(t => t.phase === p.id).length;
  const others = state.phases.filter(x => x.id !== p.id);
  return `<form class="phase-edit" id="phase-form" data-phase="${p.id}">
    <div class="pe-grid">
      <label class="field">Phase name<input id="pe-name" required value="${esc(p.name)}" placeholder="e.g. Pilot"></label>
      <label class="field">Starts<input type="date" id="pe-start" required value="${esc(p.start)}"></label>
      <label class="field">Ends<input type="date" id="pe-end" required value="${esc(p.end)}"></label>
      <label class="field pe-wide">What we accomplish together<textarea id="pe-goal" rows="2" data-grow placeholder="One sentence both sides agree on">${esc(p.goal)}</textarea></label>
    </div>
    <p class="hint pe-err" id="pe-err" hidden>The end date can't be before the start date.</p>
    <p class="hint" style="margin:6px 0 0">Phases can overlap. Their order on the plan is set with the arrows, not by date.</p>
    <div class="pe-actions">
      <button type="submit" class="btn sm primary">${isNew ? "Add phase" : "Save phase"}</button>
      <button type="button" class="btn sm" data-pe-cancel>Cancel</button>
      ${!isNew && others.length && ui.deletePhase !== p.id ? `<span class="pe-del"><button type="button" class="btn sm danger-ghost" data-pe-delete>Delete phase</button></span>` : ""}
    </div>
    ${!isNew && ui.deletePhase === p.id ? deleteBox(p, count, others) : ""}
  </form>`;
}

// Deleting a phase with tasks: pick where the tasks go, then confirm once more. Tasks are never deleted.
function neighbourOf(id) { const i = state.phases.findIndex(p => p.id === id); return (state.phases[i - 1] || state.phases[i + 1]).id; }
function deleteBox(p, count, others) {
  const to = ui.deleteTo && others.some(o => o.id === ui.deleteTo) ? ui.deleteTo : neighbourOf(p.id);
  const toName = state.phases.find(o => o.id === to).name;
  if (!ui.deleteConfirm) return `<div class="del-box">
      <b>Delete “${esc(p.name)}”</b>
      <label class="field" style="margin-top:8px">Its ${count} task${count > 1 ? "s" : ""} (including closed ones and subtasks) move to<select id="pe-moveto">${others.map(o => `<option value="${o.id}" ${o.id === to ? "selected" : ""}>${esc(o.name)}</option>`).join("")}</select></label>
      <div class="pe-actions"><button type="button" class="btn sm danger" data-pe-delete-ask>Delete phase</button><button type="button" class="btn sm" data-pe-delete-cancel>Keep phase</button></div>
    </div>`;
  return `<div class="del-box confirm" role="alertdialog" aria-label="Confirm phase deletion">
      <b>Are you sure?</b>
      <p>“${esc(p.name)}” will be removed from the plan for everyone, including ${esc(B())}. Its ${count} task${count > 1 ? "s" : ""} move to <b>${esc(toName)}</b>, nothing else changes.</p>
      <div class="pe-actions"><button type="button" class="btn sm danger" data-pe-delete-confirm>Yes, delete phase</button><button type="button" class="btn sm" data-pe-delete-cancel>Keep phase</button></div>
    </div>`;
}
function deletePhaseNow(id, to) {
  const ph = state.phases.find(p => p.id === id);
  const moved = state.tasks.filter(t => t.phase === id).length;
  if (to) state.tasks.forEach(t => { if (t.phase === id) t.phase = to; });
  state.phases = state.phases.filter(p => p.id !== id);
  log(`deleted phase “${ph.name}”${moved ? ` and moved its ${moved} tasks to ${state.phases.find(p => p.id === to).name}` : ""}`, null);
  Object.assign(ui, { editPhase: null, deletePhase: null, deleteConfirm: false, deleteTo: null, phaseMenu: null });
  save(); render(); toast(`Phase “${ph.name}” deleted${moved ? `, ${moved} tasks moved` : ""}`);
}

function phasesBlock() {
  const owner = canEditPhases();
  const n = state.phases.length;
  return state.phases.map((ph, i) => {
    const all = state.tasks.filter(t => t.phase === ph.id && visible(t));
    const tops = all.filter(t => !t.parent && (ui.filter === "all" || matches(t) || children(t.id).filter(visible).some(k => matches(k))));
    const closed = all.filter(t => t.status === "Closed").length;
    const cur = isCurrent(ph);
    const complete = all.length && closed === all.length;
    const editing = ui.editPhase === ph.id;
    return `<section class="group ${cur ? "current" : ""} ${complete ? "complete" : ""}" id="ph-${ph.id}">
      <div class="group-title">
        <span class="avatar">${complete ? "✓" : i + 1}</span>
        <div style="min-width:0"><h2>${esc(ph.name)} ${cur ? `<span class="cur-tag">CURRENT PHASE</span>` : ""}</h2><small>${esc(ph.goal)}</small></div>
        <div class="gt-right">${fmt(ph.start)} – ${fmtY(ph.end)}<div class="pbar"><i style="width:${all.length ? closed / all.length * 100 : 0}%"></i></div>${closed}/${all.length} closed</div>
        ${owner ? `<div class="ph-tools">
          <button type="button" class="ph-btn ${ui.phaseMenu === ph.id || editing ? "on" : ""}" data-phmenu="${ph.id}" aria-haspopup="menu" aria-expanded="${ui.phaseMenu === ph.id}" aria-label="Phase options for ${esc(ph.name)}" title="Phase options">${DOTS}</button>
          ${ui.phaseMenu === ph.id ? `<div class="ph-menu" role="menu">
            <button type="button" role="menuitem" data-phedit="${ph.id}">${PENCIL}Edit phase</button>
            <button type="button" role="menuitem" data-phmove="${ph.id}:-1" ${i === 0 ? "disabled" : ""}><span class="mi">↑</span>Move up</button>
            <button type="button" role="menuitem" data-phmove="${ph.id}:1" ${i === n - 1 ? "disabled" : ""}><span class="mi">↓</span>Move down</button>
            ${n > 1 ? `<button type="button" role="menuitem" class="danger-item" data-phdelete="${ph.id}"><span class="mi">×</span>Delete phase</button>` : ""}
          </div>` : ""}
        </div>` : ""}
      </div>
      ${editing ? phaseEditForm(ph) : ""}
      <div class="cards" data-phase="${ph.id}">
        ${tops.map(cardHtml).join("") || `<div class="empty">No tasks in this phase match the filter.</div>`}
        ${!canCreate() ? "" : ui.inlineAdd === ph.id ? `<form class="card inline-new" data-inline="${ph.id}">
            <input type="checkbox" class="card-check" disabled aria-hidden="true" tabindex="-1">
            <div class="card-body"><input class="inline-title" id="inline-${ph.id}" placeholder="Task name" autocomplete="off" aria-label="Name of the new task in ${esc(ph.name)}">
              <div class="inline-foot"><span class="hint" style="margin:0">Enter adds it and starts the next one · Esc cancels</span><span class="inline-btns"><button type="button" class="btn sm" data-inline-cancel>Cancel</button><button type="submit" class="btn sm primary">Add task</button></span></div></div>
          </form>` : `<button type="button" class="add-task-btn" data-inline-open="${ph.id}"><span class="i i-plus"></span>Add a task</button>`}
      </div>
    </section>`;
  }).join("") + (owner ? (ui.editPhase === "new" ? `<section class="group"><div class="group-title"><span class="avatar">${n + 1}</span><div><h2>New phase</h2></div></div>${phaseEditForm(null)}</section>` : `<button type="button" class="add-phase" data-phedit="new"><span class="i i-plus"></span>Add phase</button>`) : "");
}

function wirePhases(app) {
  app.querySelectorAll("[data-phmenu]").forEach(b => b.onclick = e => { e.stopPropagation(); ui.phaseMenu = ui.phaseMenu === b.dataset.phmenu ? null : b.dataset.phmenu; render(); });
  const startDelete = id => {
    if (!state.tasks.some(t => t.phase === id)) { deletePhaseNow(id, null); return; }
    Object.assign(ui, { phaseMenu: null, editPhase: id, deletePhase: id, deleteConfirm: false, deleteTo: null }); render();
    document.querySelector(".del-box")?.scrollIntoView({ block: "nearest" });
  };
  app.querySelectorAll("[data-phdelete]").forEach(b => b.onclick = () => startDelete(b.dataset.phdelete));
  app.querySelectorAll("[data-phmove]").forEach(b => b.onclick = () => {
    ui.phaseMenu = null;
    const [id, dir] = b.dataset.phmove.split(":"), i = state.phases.findIndex(p => p.id === id), j = i + Number(dir);
    if (j < 0 || j >= state.phases.length) return;
    const [ph] = state.phases.splice(i, 1); state.phases.splice(j, 0, ph);
    log(`moved phase “${ph.name}” ${Number(dir) < 0 ? "up" : "down"}`, null); save(); render();
    document.getElementById("ph-" + id)?.scrollIntoView({ block: "nearest" });
  });
  app.querySelectorAll("[data-phedit]").forEach(b => b.onclick = () => { ui.phaseMenu = null; ui.editPhase = ui.editPhase === b.dataset.phedit ? null : b.dataset.phedit; ui.deletePhase = null; render(); $("#pe-name")?.focus(); });
  const f = $("#phase-form"); if (!f) return;
  f.querySelector("[data-pe-cancel]").onclick = () => { Object.assign(ui, { editPhase: null, deletePhase: null, deleteConfirm: false, deleteTo: null }); render(); };
  const del = f.querySelector("[data-pe-delete]"); if (del) del.onclick = () => startDelete(f.dataset.phase);
  const mt = $("#pe-moveto"); if (mt) mt.onchange = () => { ui.deleteTo = mt.value; };
  const ask = f.querySelector("[data-pe-delete-ask]"); if (ask) ask.onclick = () => { ui.deleteTo = $("#pe-moveto").value; ui.deleteConfirm = true; render(); };
  f.querySelectorAll("[data-pe-delete-cancel]").forEach(b => b.onclick = () => { Object.assign(ui, { deletePhase: null, deleteConfirm: false, deleteTo: null }); render(); });
  const delOk = f.querySelector("[data-pe-delete-confirm]"); if (delOk) delOk.onclick = () => deletePhaseNow(f.dataset.phase, ui.deleteTo || neighbourOf(f.dataset.phase));
  f.onsubmit = e => {
    e.preventDefault();
    const name = $("#pe-name").value.trim(), start = $("#pe-start").value, end = $("#pe-end").value, goal = $("#pe-goal").value.trim();
    if (!name || !start || !end) return;
    if (end < start) { $("#pe-err").hidden = false; return; }
    if (f.dataset.phase === "new") {
      const ph = { id: "ph" + (++state.seq), name, goal, start, end };
      state.phases.push(ph); log(`added phase “${name}”`, null); toast(`Phase “${name}” added`);
    } else {
      const ph = state.phases.find(p => p.id === f.dataset.phase);
      const changes = [ph.name !== name ? "name" : "", ph.goal !== goal ? "description" : "", ph.start !== start || ph.end !== end ? "dates" : ""].filter(Boolean);
      Object.assign(ph, { name, goal, start, end });
      if (changes.length) log(`changed the ${changes.join(", ")} of phase “${name}”`, null);
    }
    ui.editPhase = null; save(); render();
  };
}

function cardHtml(t) {
  const kids = children(t.id).filter(visible);
  const kc = kids.filter(k => k.status === "Closed").length;
  const open = ui.expanded.has(t.id) || (ui.filter !== "all" && kids.some(k => matches(k)));
  const owner = person(t.owner);
  const last = t.updates[t.updates.length - 1];
  const desc = t.desc || (last ? `${person(last.by).name.split(" ")[0]}: ${last.text}` : "");
  const card = `<div class="card ${t.status === "Closed" ? "done" : ""} ${ui.open === t.id ? "active" : ""} ${ui.justAdded === t.id ? "just-added" : ""}" role="button" tabindex="0" data-open="${t.id}">
    ${canReorder() ? `<button type="button" class="grip" data-grip="${t.id}" aria-label="Move “${esc(t.title)}”: drag, or use the up and down arrow keys" title="Drag to reorder">⠿</button>` : ""}
    <input type="checkbox" class="card-check ${t.status === "In progress" ? "half" : ""}" data-check="${t.id}" ${t.status === "Closed" ? "checked" : ""} ${canEdit(t) ? "" : "disabled"} aria-label="Close “${esc(t.title)}”" title="${t.status === "Closed" ? "Reopen" : "Close task"}">
    <div class="card-body">
      <div class="card-head">
        ${ui.mode === "seller" && byBuyer(t) ? `<span class="badge-buyer">ADDED BY ${esc(B().toUpperCase())}</span>` : ""}
        <h3>${esc(t.title)}</h3>
      </div>
      ${desc ? `<p>${esc(desc)}</p>` : ""}
      <div class="meta">
        <span class="${owner.side === "buyer" ? "side-b" : ""}"><span class="i i-owner"></span>${esc(owner.name)}</span>
        <span class="${isOver(t) ? "late" : ""}"><span class="i i-cal"></span>${isOver(t) ? "Overdue · " : ""}${t.due ? fmt(t.due) : "No due date"}</span>
        ${t.status === "In progress" ? `<span class="prog">In progress</span>` : ""}
        ${(t.coworkers || []).length ? `<span><span class="i i-people"></span>${t.coworkers.map(id => esc(person(id).name)).join(", ")}</span>` : ""}
        ${(t.recipients || []).length ? `<span>Requested by ${t.recipients.map(id => esc(person(id).name)).join(", ")}</span>` : ""}
        ${kids.length ? `<button type="button" class="sub-toggle" data-exp="${t.id}" aria-expanded="${open}"><span class="i i-chev chev"></span>${kc}/${kids.length} subtasks</button>` : ""}
        ${t.milestone ? `<span class="flag mile"><span class="i i-star"></span>Milestone</span>` : ""}
        ${ui.mode === "seller" && !t.shared ? `<span class="flag">Internal · hidden from ${esc(B())}</span>` : ""}
        ${t.updates.length ? `<span>${t.updates.length} update${t.updates.length > 1 ? "s" : ""}</span>` : ""}
      </div>
    </div>
  </div>`;
  const subs = open && kids.length ? `<div class="subs">${kids.filter(k => ui.filter === "all" || matches(k) || matches(t)).map(subHtml).join("")}</div>` : "";
  return card + subs;
}

// Task AI's status pill (Open / In progress / Closed), shown on subtasks just before the due date.
function statusPill(t) { return `<span class="status sub-status ${statusClass(t.status)}">${esc(t.status)}</span>`; }

function subHtml(k) {
  return `<div class="sub ${k.status === "Closed" ? "done" : ""}">
    <input type="checkbox" data-check="${k.id}" ${k.status === "Closed" ? "checked" : ""} ${canEdit(k) ? "" : "disabled"} aria-label="Close “${esc(k.title)}”">
    <button type="button" class="st" data-open="${k.id}">${esc(k.title)}</button>
    ${k.milestone || (ui.mode === "seller" && !k.shared) ? `<div class="tags">${k.milestone ? `<span class="mile">Milestone</span>` : ""}${ui.mode === "seller" && !k.shared ? `<span class="internal">Internal</span>` : ""}</div>` : ""}
    <div class="meta">${statusPill(k)}<span class="dt ${isOver(k) ? "late" : ""}">${k.due ? fmt(k.due) : ""}</span>${avatar(k.owner, "av-sm")}</div>
  </div>`;
}

function statsFor(id) {
  const items = state.tasks.filter(t => visible(t) && (t.owner === id || (t.coworkers || []).includes(id) || (t.recipients || []).includes(id)));
  const week = new Date(TODAY); week.setDate(week.getDate() + 7);
  const closed = items.filter(t => t.status === "Closed").length;
  const overdue = items.filter(isOver).length;
  const dueWeek = items.filter(t => t.status !== "Closed" && !isOver(t) && t.due && d(t.due) <= week).length;
  const open = items.length - closed - overdue - dueWeek;
  return { total: items.length, closed, overdue, dueWeek, open,
    owner: items.filter(t => t.owner === id).length, coworker: items.filter(t => (t.coworkers || []).includes(id)).length, recipient: items.filter(t => (t.recipients || []).includes(id)).length };
}

function peopleTab() {
  const seller = ui.mode === "seller";
  const digestStrip = seller && me() === state.planOwners.seller ? `<section class="panel digest-strip">
      <div><h3>Monday digest</h3><p class="hint" style="margin:2px 0 0">One email per person per week. Plan owners also get the plan overview. Nothing else goes to ${esc(B())}.</p></div>
      <div class="po-row"><label class="field">${esc(B())} plan owner${ownerSelect("buyer")}</label><label class="field">iSEEit plan owner${ownerSelect("seller")}</label></div>
    </section>` : "";
  return `${digestStrip}${teamSection("buyer")}${teamSection("seller")}`;
}
function ownerSelect(side) {
  return `<select id="po-${side}" aria-label="${side === "buyer" ? B() : "iSEEit"} plan owner">${state.people.filter(p => p.side === side && p.email && !/Placeholder|Shared mailbox/.test(p.title)).map(p => `<option value="${p.id}" ${state.planOwners[side] === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>`;

function teamSection(side) {
  const people = state.people.filter(p => p.side === side);
  const label = side === "buyer" ? `${B()} team` : "iSEEit team";

    ${ui.addFor === side ? addPersonForm(side) : ""}
    <div class="plist">${people.map(x => personRow(x, maxTotal)).join("")}</div>
  </section>`;

function addPersonForm(side) {
  if (side === "seller") {

function inviteState(p) {
  if (p.side === "seller") return { cls: "member", text: "Task AI user" };
  const inv = p.invite || { status: "none" };
  if (!p.email) return { cls: "warn", text: "No email" };

  if (inv.status === "invited") return { cls: "invited", text: `Invited ${inv.at ? fmt(inv.at) : ""}` };

}

  items.sort((a, b) => rank(a) - rank(b) || (a.due || "9999").localeCompare(b.due || "9999"));

// Recent activity: a short summary of the last 7 days on top (AI inside Task AI, rule-based elsewhere or as
// a fallback), and the full list behind "Show all activity", grouped by day with repeated entries merged.
function activityItems() { return state.activity.filter(a => { if (!a.task) return true; const t = state.tasks.find(x => x.id === a.task); return !t || visible(t); }); }
function lastWeek(items) { const since = addDays(isoOf(TODAY), -7); return items.filter(a => a.at >= since); }
function ruleSummary(items) {
  if (!items.length) return "No activity in the last 7 days.";
  const count = re => items.filter(a => re.test(a.text)).length;
  const names = [...new Set(items.map(a => person(a.by).name))];
  const who = names.length <= 2 ? names.join(" and ") : `${names.slice(0, 2).join(", ")} and ${names.length - 2} other${names.length > 3 ? "s" : ""}`;
  const closedTitles = items.filter(a => /^closed “/.test(a.text)).map(a => a.text.match(/“(.+?)”/)?.[1]).filter(Boolean).slice(0, 2);
  const msMoved = items.filter(a => /^moved milestone “/.test(a.text)).map(a => a.text.match(/“(.+?)”/)?.[1]).filter(Boolean);
  const n = (k, one, many) => k ? `${k} ${k === 1 ? one : many}` : "";
  const parts = [
    n(count(/^closed “/), "task closed", "tasks closed") + (closedTitles.length ? ` (${closedTitles.join(", ")})` : ""),
    n(count(/^posted an update|^replied by email/), "status update", "status updates"),
    n(count(/^added “/), "new task", "new tasks"),
    n(count(/^added subtask/), "new subtask", "new subtasks"),
    msMoved.length ? `${n(msMoved.length, "milestone moved", "milestones moved")} (${msMoved.slice(0, 2).join(", ")})` : "",
    n(count(/^moved “.+” (from|to) \d/), "date changed", "dates changed"),
    n(count(/^assigned |as coworker on|as requester on/), "people change on tasks", "people changes on tasks"),
    n(count(/^edited the description|^renamed /), "description or title edited", "descriptions or titles edited"),
  ].filter(Boolean);
  return `In the last 7 days ${who} made ${n(items.length, "change", "changes")}${parts.length ? `: ${parts.slice(0, -1).join(", ")}${parts.length > 1 ? " and " : ""}${parts[parts.length - 1]}` : ""}.`;
}
// AI summary from Task AI (only when this page runs inside the app). Waits until changes stop for a moment,
// then asks once per state of the activity; the result is kept so re-renders don't ask again.
function aiSummaryKey(items) { return `${state.id}|${items.length}|${items[0] ? items[0].at + items[0].text : ""}`; }
function requestAiSummary(items) {
  if (!location.pathname.startsWith("/close-plans") || !items.length) return;
  const key = aiSummaryKey(items);
  if (ui.aiSum && ui.aiSum.key === key) return;
  ui.aiSum = { key, text: null };
  clearTimeout(requestAiSummary.t);
  requestAiSummary.t = setTimeout(async () => {
    try {
      const r = await fetch("/api/close-plans/activity-summary", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ plan: state.title, items: items.map(a => ({ at: a.at, who: person(a.by).name, text: a.text })) }) });
      const data = await r.json().catch(() => ({}));
      if (!ui.aiSum || ui.aiSum.key !== key) return;
      ui.aiSum.text = r.ok && data.summary ? data.summary : "";
    } catch (e) { if (ui.aiSum && ui.aiSum.key === key) ui.aiSum.text = ""; }
    const box = document.getElementById("act-summary"); if (box) box.innerHTML = summaryHtml(items);
  }, 1500);
}
function summaryHtml(items) {
  const ai = ui.aiSum && ui.aiSum.key === aiSummaryKey(items) && ui.aiSum.text;
  const waiting = location.pathname.startsWith("/close-plans") && ui.aiSum && ui.aiSum.key === aiSummaryKey(items) && ui.aiSum.text === null;
  return `<span class="act-label">${ai ? "AI SUMMARY" : "SUMMARY"} · LAST 7 DAYS${waiting ? ` <i class="act-wait">updating…</i>` : ""}</span><p>${esc(ai || ruleSummary(items))}</p>`;
}
function activityPanel() {
  const all = activityItems(), week = lastWeek(all);
  requestAiSummary(week);
  // Group by day; identical entries in a row (same person, same text, same day) collapse into one "×n".
  const merged = [];
  for (const a of all) { const last = merged[merged.length - 1]; if (last && last.by === a.by && last.text === a.text && last.at === a.at) last.n++; else merged.push({ ...a, n: 1 }); }
  const dayLabel = at => at === isoOf(TODAY) ? "Today" : at === addDays(isoOf(TODAY), -1) ? "Yesterday" : fmtY(at);
  let list = "", lastDay = "";
  for (const a of merged) {
    if (a.at !== lastDay) { list += `<li class="act-day">${esc(dayLabel(a.at))}</li>`; lastDay = a.at; }
    list += `<li>${avatar(a.by)}<div><b>${esc(person(a.by).name)}</b> ${esc(a.text)}${a.n > 1 ? ` <span class="act-n">×${a.n}</span>` : ""}</div></li>`;
  }
  return `<section class="panel"><h3>Recent activity</h3>
    <div class="act-summary" id="act-summary">${summaryHtml(week)}</div>
    ${all.length ? `<button type="button" class="act-toggle" data-act-toggle aria-expanded="${Boolean(ui.actOpen)}"><span class="i i-chev chev"></span>${ui.actOpen ? "Hide activity" : `Show all activity (${all.length})`}</button>` : ""}
    ${ui.actOpen ? `<ul class="feed">${list}</ul>` : ""}
    ${ui.mode === "seller" ? `<p class="hint">When ${esc(B())} changes something, the task owner gets a Slack message or email, the same as any Task AI update.</p>` : ""}</section>`;
}

// People fields (Owner, Coworkers, Requested by): chips in an input-like box. "+ Add" / "Change" opens a small
// panel with a search box; results are grouped by team, and plan owners also see Task AI users not yet on the plan.
// This replaces the plain dropdowns, which Task AI also uses and which get hard to scan as lists grow.
const PF_LABEL = { owner: "Owner", coworkers: "Coworkers", recipients: "Requested by" };
function peopleField(t, key, edit) {
  const ids = key === "owner" ? [t.owner] : (t[key] || []);
  const chip = id => { const p = person(id); return `<span class="chip ${p.side === "buyer" ? "chip-b" : ""}">${esc(p.name)}${edit && key !== "owner" ? `<button type="button" data-rm="${key}:${id}" aria-label="Remove ${esc(p.name)}">×</button>` : ""}</span>`; };
  const open = ui.picker && ui.picker.key === key;
  return `<div class="pfield ${edit ? "" : "ro"} ${open ? "open" : ""}" data-pfield="${key}">
    <div class="pf-box">${ids.map(chip).join("")}${!ids.length && !edit ? `<span class="none">None</span>` : ""}
      ${edit ? `<button type="button" class="pf-add" data-pf-open="${key}" aria-expanded="${open}" aria-label="${key === "owner" ? "Change owner" : `Add to ${PF_LABEL[key]}`}">${key === "owner" ? "Change" : ids.length ? "+ Add" : "+ Add someone"}</button>` : ""}</div>
    ${open ? `<div class="pf-pop" role="dialog" aria-label="${PF_LABEL[key]}"><input class="pf-search" id="pf-q" placeholder="Search by name, title or email" autocomplete="off" value="${esc(ui.picker.q || "")}"><div class="pf-list" id="pf-list" role="listbox">${pickerList(t, key, ui.picker.q || "")}</div></div>` : ""}
  </div>`;
}
function pickerList(t, key, q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = (name, extra) => words.every(w => `${name} ${extra}`.toLowerCase().includes(w));
  const taken = new Set(key === "owner" ? [t.owner] : [t.owner, ...(t.coworkers || []), ...(t.recipients || [])]);
  const row = (val, name, sub, side) => `<button type="button" class="pf-opt" role="option" data-pf-pick="${esc(val)}"><span class="avatar av-sm ${side === "buyer" ? "buyer" : ""}">${esc(initials(name))}</span><span class="pf-name">${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ""}</span></button>`;
  const group = (label, items) => items.length ? `<div class="pf-group">${esc(label)}</div>${items.join("")}` : "";
  const side = sd => state.people.filter(p => p.side === sd && !taken.has(p.id) && hit(p.name, `${p.title} ${p.email || ""} ${p.role || ""}`)).map(p => row(p.id, p.name, p.role || p.title, sd));
  const others = (canManage("seller") || canManage("buyer")) ? notOnPlan().filter(o => hit(o.name, `${o.email || ""} ${o.title || ""}`)).map(o => row("add:" + o.key, o.name, o.email || o.title, "seller")) : [];
  const html = group(B(), side("buyer")) + group("iSEEit", side("seller")) + group("Other Task AI users · adds them to the plan", others);
  return html || `<p class="pf-empty">${q ? `No one matches “${esc(q)}”.` : "Everyone on the plan is already on this task."}</p>`;
}
function pickPerson(t, key, val) {
  let id = val;
  if (val.startsWith("add:")) { id = addUserToPlan(val.slice(4)); if (!id) { toast("Only plan owners can add people to the plan"); return; } toast(`${person(id).name} added to the plan`); }
  if (key === "owner") { t.owner = id; t.coworkers = (t.coworkers || []).filter(x => x !== id); log(`assigned “${t.title}” to ${person(id).name}`, t.id); ui.picker = null; }
  else { t[key] = [...(t[key] || []), id]; log(`added ${person(id).name} as ${key === "coworkers" ? "coworker" : "requester"} on “${t.title}”`, t.id); ui.picker = { key, q: "" }; }
  save(); render();
}
function wirePicker(root, t) {
  root.querySelectorAll("[data-pf-open]").forEach(b => b.onclick = e => { e.stopPropagation(); const k = b.dataset.pfOpen; ui.picker = ui.picker && ui.picker.key === k ? null : { key: k, q: "" }; render(); });
  const q = root.querySelector("#pf-q"); if (!q) return;
  const key = ui.picker.key, list = root.querySelector("#pf-list");
  const wireOpts = () => list.querySelectorAll("[data-pf-pick]").forEach(o => o.onclick = e => { e.stopPropagation(); pickPerson(t, key, o.dataset.pfPick); });
  wireOpts();
  q.oninput = () => { ui.picker.q = q.value; list.innerHTML = pickerList(t, key, q.value); wireOpts(); };
  q.onkeydown = e => {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); ui.picker = null; render(); }
    if (e.key === "Enter") { e.preventDefault(); const first = list.querySelector("[data-pf-pick]"); if (first) pickPerson(t, key, first.dataset.pfPick); }
    if (e.key === "ArrowDown") { e.preventDefault(); list.querySelector("[data-pf-pick]")?.focus(); }
  };
  list.onkeydown = e => { if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const opts = [...list.querySelectorAll("[data-pf-pick]")], i = opts.indexOf(document.activeElement); (opts[i + (e.key === "ArrowDown" ? 1 : -1)] || (e.key === "ArrowUp" ? q : null))?.focus(); } if (e.key === "Escape") { ui.picker = null; render(); } };
  root.querySelector(".pf-pop").onclick = e => e.stopPropagation();
  setTimeout(() => { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 0);
}
// Active Task AI users who aren't on this plan yet. Only plan owners can add people, so only they get this group;
// picking one adds them to the plan and to the task in one go.
function notOnPlan() { return SELLER_OPTIONS().filter(o => !state.people.some(p => p.name === o.name || (o.email && p.email === o.email))); }
function notOnPlanOpts() {
  if (!canManage("seller") && !canManage("buyer")) return "";
  const list = notOnPlan(); if (!list.length) return "";
  return `<optgroup label="${usingAppUsers() ? "Other Task AI users (adds them to the plan)" : "Other Task AI users, demo examples (adds them to the plan)"}">${list.map(o => `<option value="add:${esc(o.key)}">${esc(o.name)}${o.email ? ` · ${esc(o.email)}` : ""}</option>`).join("")}</optgroup>`;
}
// Adds a Task AI user to the plan. Someone whose email domain is the customer's joins the customer team, everyone else the iSEEit team.
function addUserToPlan(key) {
  const o = SELLER_OPTIONS().find(x => x.key === key); if (!o) return null;
  const buyer = Boolean(state.domain && o.email && o.email.toLowerCase().endsWith("@" + state.domain.toLowerCase()));
  if (buyer && !canManage("buyer")) return null;
  if (!buyer && !canManage("seller")) return null;
  const side = buyer ? "buyer" : "seller", id = "p" + (++state.seq);
  state.people.push({ id, name: o.name, email: o.email || "", title: (o.title || "Task AI user").replace(" · Task AI user", ""), role: "", side, access: { ...ACCESS_DEFAULTS[side] }, invite: side === "seller" ? { status: "member" } : { status: "none" } });
  log(`added ${o.name} to the ${side === "buyer" ? B() : "iSEEit"} team`, null);
  return id;
}

// Prototype of the notification rules: Task AI's existing rules for iSEEit users,
// and the proposed email-only rules for Meridian Biotech contacts (to be decided).
function notifySection(t) {
  const parent = parentOf(t);
  const internal = !t.shared || (parent && !parent.shared);
  const seen = new Set();
  const rows = [[t.owner, "Owner"], ...(t.coworkers || []).map(id => [id, "Coworker"]), ...(t.recipients || []).map(id => [id, "Requested by"])]
    .filter(([id]) => !seen.has(id) && seen.add(id));
  const how = (p, role, id) => {
    if (p.side === "seller") {
      if (role === "Owner") return "Slack on updates · “My tasks” in weekly digest · overdue reminders";
      if (role === "Coworker") return "Slack on updates · “My tasks” in weekly digest";
      return "Slack on updates · “Requested by you” in weekly digest";
    }
    if (internal) return "Not notified: internal task";
    if (!p.email) return "Can’t be reached: no email in Sales AI";
    const po = state.planOwners.buyer === id ? " (with the plan overview, as plan owner)" : "";
    return `Monday email only: “${role === "Requested by" ? "Requested by you" : "My tasks"}” section${po}`;
  };
  return `<div class="section"><h3>Who hears about this task</h3>
    <ul class="notify-list">${rows.map(([id, role]) => { const p = person(id); const txt = how(p, role, id); const off = /^Not|^Can/.test(txt);
      return `<li>${avatar(id, "av-sm")}<div style="flex:1;min-width:0"><b>${esc(p.name)}</b> <span class="role">${role}</span><small class="${off ? "off" : ""}">${esc(txt)}</small></div>${!off && p.side === "buyer" && t.status !== "Closed" ? `<button type="button" class="mini" data-ask="${id}">Ask for an update</button>` : ""}</li>`; }).join("")}</ul>
    <p class="hint" style="margin-top:10px">${esc(B())} contacts get at most one email per week from this plan. No email per update, no separate reminders.</p>
    ${internal && rows.some(([id]) => person(id).side === "buyer") ? `<p class="perm" style="margin:10px 0 0">This task is internal, but ${esc(B())} people are named on it. They won't see it or be notified.</p>` : ""}
  </div>`;
}

// Weekly digest (Monday). At most one email per person per plan:
// - each side's plan owner gets the plan overview plus their own tasks;
// - other Meridian Biotech contacts get only their own tasks (owner/coworker, tracking), and nothing if nothing is open;
// - other iSEEit people already get these tasks in their regular Task AI digest, so no extra email.
function seenBy(id) { const side = person(id).side; return t => side === "seller" || (t.shared && (!parentOf(t) || parentOf(t).shared)); }
function digestFor(id) {
  const p = person(id), canSee = seenBy(id);
  const open = state.tasks.filter(t => canSee(t) && t.status !== "Closed");
  const byDue = (a, b) => (a.due || "9999").localeCompare(b.due || "9999");
  const mine = open.filter(t => t.owner === id || (t.coworkers || []).includes(id)).sort(byDue);
  const tracking = open.filter(t => t.owner !== id && !(t.coworkers || []).includes(id) && (t.recipients || []).includes(id)).sort(byDue);
  const isOwner = state.planOwners[p.side] === id;
  let kind = "tasks", reason = "";
  if (isOwner) kind = "plan";
  else if (p.side === "seller") { kind = null; reason = "Already in their regular Task AI digest"; }
  else if (!p.email) { kind = null; reason = "No email address"; }
  else if (!p.invite || p.invite.status === "none") { kind = null; reason = "Not invited yet"; }
  else if (!mine.length && !tracking.length) { kind = null; reason = "Nothing open: no email this week"; }
  const soon = new Date(TODAY); soon.setDate(soon.getDate() + 14);
  const weekAgo = new Date(TODAY); weekAgo.setDate(weekAgo.getDate() - 7);
  const all = state.tasks.filter(canSee);
  const mineSet = new Set([...mine, ...tracking].map(t => t.id));
  const others = t => !mineSet.has(t.id);
  return {
    p, kind, reason, mine, tracking,
    overdue: open.filter(isOverdueT).sort(byDue),
    overdueOthers: open.filter(t => isOverdueT(t) && others(t)).sort(byDue),
    dueSoon: open.filter(t => !isOverdueT(t) && t.due && d(t.due) <= soon && others(t)).sort(byDue),
    closedWeek: all.filter(t => t.status === "Closed" && t.closedAt && d(t.closedAt) >= weekAgo),
    msMoves: all.filter(t => t.milestone && recentMove(t, 7)).map(t => ({ t, c: recentMove(t, 7) })),
    total: all.length, closed: all.filter(t => t.status === "Closed").length,
  };
}
function isOverdueT(t) { return isOver(t); }

function emailCard(t, id) {
  const role = t.owner === id ? "Owner" : (t.coworkers || []).includes(id) ? "Coworker" : (t.recipients || []).includes(id) ? "Requested by you" : "";
  const closed = t.status === "Closed";
  const dueColor = closed ? "#25784b" : isOver(t) ? "#c87300" : "#5c6b7d";
  const dueLabel = closed ? `Closed${t.closedAt ? ` · ${fmt(t.closedAt)}` : ""}` : isOver(t) ? `Overdue · ${fmt(t.due)}` : t.due ? `Due · ${fmt(t.due)}` : "No due date";
  const sb = closed ? "#e4f4eb" : t.status === "In progress" ? "#fff1d6" : "#f2f4f7", sc = closed ? "#25784b" : t.status === "In progress" ? "#9b5d00" : "#202735";
  const parent = parentOf(t);
  const ownerLine = role === "Owner" ? "" : `Owner: ${person(t.owner).name}`;
  return `<div class="em-card"><div class="em-card-h">${esc(t.title)}${parent ? `<div class="em-parent">Part of ${esc(parent.title)}</div>` : ""}</div>

// Task AI's manual notify email for one task: its reply-to is a personal reply+token address,
// so whatever the contact writes back is posted on the task (and a status change in the reply is picked up).
function renderAsk() {

  const t = state.tasks.find(x => x.id === ui.ask.task), p = person(ui.ask.who), first = p.name.split(" ")[0];
  const from = person(me());
  const replyTo = `reply+${(t.id + p.id + "7f3a9c").replace(/[^a-z0-9]/gi, "").toLowerCase()}@tasks.iseeit.ai`;
  root.innerHTML = `<div class="overlay em-overlay" data-aclose-bg><div class="em-modal" role="dialog" aria-modal="true" aria-label="Ask for an update">

    <div style="padding:16px 22px;border-bottom:1px solid var(--line)"><label class="field" style="display:flex">Your note<textarea id="ask-msg" data-grow style="border:1px solid var(--field);border-radius:8px;padding:10px 12px;min-height:70px;font-weight:400;font-size:14px;resize:vertical">Hi ${esc(first)}, could you give us a quick update on this? Just reply to this email.</textarea></label>

  const r = $("#ask-reply"); if (r) r.onclick = () => {
    const text = "Working on it now, you'll have it by Friday.";

    startWork(t, p.id);

}

// Floating tooltip for milestone diamonds, placed above the diamond and kept inside the window.
function showTip(m) {
  const tpl = m.querySelector(".ms-tip"); if (!tpl) return;
  let tip = document.getElementById("float-tip");
  if (!tip) { tip = document.createElement("div"); tip.id = "float-tip"; tip.className = "float-tip"; tip.setAttribute("role", "tooltip"); document.body.appendChild(tip); }
  tip.innerHTML = tpl.innerHTML; tip.hidden = false;
  const r = m.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
  tip.style.top = (r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8) + "px";
}

const usingAppUsers = () => Boolean(APP_USERS && APP_USERS.length);

];
const isoOf = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
const addDays = (iso, n) => { const x = d(iso); x.setDate(x.getDate() + n); return isoOf(x); };
// Template dates are fitted into the real timeframe (plan start → signature → go-live). Each template date is a
// day number on the template's own scale: signature = 0, go-live = tpl.live (its typical gap). Days before
// signature are stretched or squeezed between the plan start and the signature date, days between signature and
// go-live between those two dates, and days after go-live keep their distance (e.g. a 30-day adoption review).
const daysBetween = (a, b) => Math.round((d(b) - d(a)) / 864e5);
const tplOf = w => TEMPLATES.find(t => t.id === w.tpl);
const tplDay = (tpl, [anchor, off]) => anchor === "G" ? (tpl.live || 45) + off : off;
const tplEarliest = tpl => Math.min(0, ...tpl.phases.flatMap(p => [p[3], p[4]]).concat(tpl.tasks.flatMap(t => [t[3], ...(((t[4] || {}).subs) || []).map(x => x[2])])).map(x => tplDay(tpl, x)));
function tplDate(w, at) {
  const tpl = tplOf(w), t = tplDay(tpl, at), live = tpl.live || 45, first = tplEarliest(tpl);
  if (t <= 0) return first < 0 ? addDays(w.start, Math.round((t - first) / -first * daysBetween(w.start, w.sign))) : w.sign;
  if (t <= live) return addDays(w.sign, Math.round(t / live * daysBetween(w.sign, w.live)));
  return addDays(w.live, t - live);
}
const tplRoles = tpl => {
  const used = new Map();
  const add = (r, n = 1) => used.set(r, (used.get(r) || 0) + n);
  tpl.tasks.forEach(([, , role, , o = {}]) => { add(role); (o.co || []).forEach(r => add(r)); (o.rq || []).forEach(r => add(r)); (o.subs || []).forEach(([, sr, , so = {}]) => { add(sr); (so.co || []).forEach(r => add(r)); }); });
  return [...used.entries()].map(([r, n]) => ({ role: r, count: n }));
};
const tplCount = tpl => tpl.tasks.reduce((n, t) => n + 1 + ((t[4] || {}).subs || []).length, 0);
const tplMilestones = tpl => tpl.tasks.reduce((n, t) => n + ((t[4] || {}).ms ? 1 : 0) + ((t[4] || {}).subs || []).filter(s => (s[3] || {}).ms).length, 0);

async function runSearch() {
  const w = ui.wizard; if (!w) return;
  const q = (w.q || "").trim(), seq = (w.searchSeq = (w.searchSeq || 0) + 1);
  if (LIVE_SEARCH && !w.liveOff) {
    if (q.length < 2) { w.hits = null; return paintHits(); }
    w.searching = true; paintHits();
    try {
      const r = await fetch(`/api/close-plans/opportunities?q=${encodeURIComponent(q)}`, { credentials: "same-origin" });
      const data = await r.json().catch(() => ({}));
      if (seq !== w.searchSeq) return;
      if (r.status === 401 || r.status === 403) { w.liveOff = data.error || "Live Sales AI search isn't available for your account."; }
      else if (!r.ok) { w.searchErr = data.error || "Sales AI is not reachable right now."; w.hits = []; }
      else { w.searchErr = ""; w.hits = (data.opportunities || []).map(o => ({ src: "live", id: o.id, account: o.accountName || "Unknown account", accountId: o.accountId, opp: o.name, stage: o.stage, amount: o.amount, close: o.closeDate, open: o.open })); }
    } catch (e) { if (seq === w.searchSeq) { w.searchErr = "Sales AI is not reachable right now."; w.hits = []; } }
    w.searching = false;
    if (!w.liveOff) return paintHits();
  }
  w.hits = q ? demoHits(q) : demoHits("");
  paintHits();
}
function hitsHtml() {
  const w = ui.wizard, live = LIVE_SEARCH && !w.liveOff;
  if (w.searching && !w.hits) return `<p class="hint">Searching Sales AI…</p>`;
  if (w.searchErr) return `<p class="perm">${esc(w.searchErr)} You can still enter the deal by hand.</p>`;
  if (!w.hits) return live ? `<p class="hint">Type at least two letters of the customer or the opportunity name.</p>` : "";
  if (!w.hits.length) return `<p class="hint">No opportunity matches “${esc(w.q)}”. Check the spelling or enter the deal by hand.</p>`;
  return w.hits.map(h => {
    const on = (w.opp === "live" && w.liveOpp && w.liveOpp.id === h.id) || w.opp === h.id;
    return `<button type="button" class="wz-card wz-hit ${on ? "on" : ""} ${h.open ? "" : "closed"}" data-hit="${esc(h.id)}">
      <b>${esc(h.account)}</b><span>${esc(h.opp)}</span><small>${esc(h.stage || "No stage")} · ${money(h.amount)}${h.close ? ` · close ${fmtY(h.close)}` : ""}${h.src === "demo" ? ` · ${h.contacts} contacts` : ""}${h.open ? "" : " · closed"}</small></button>`;

}

// Suggest a contact for each buyer role from job titles; seller roles default to the person creating the plan.
function wzSuggest() {
  const w = ui.wizard, tpl = TEMPLATES.find(t => t.id === w.tpl), contacts = wzContacts();
  const taken = new Set();
  tplRoles(tpl).forEach(({ role }) => {
    if (w.map[role] !== undefined) return;
    const R = ROLES[role];
    if (R.side === "seller") { w.map[role] = "rf"; return; }
    const pats = Array.isArray(R.match) ? R.match : [R.match];
    let i = -1;
    for (const re of pats) { i = contacts.findIndex((c, idx) => !taken.has(idx) && re.test(c.title || "")); if (i >= 0) break; }
    if (i < 0) for (const re of pats) { i = contacts.findIndex(c => re.test(c.title || "")); if (i >= 0) break; }
    w.map[role] = i >= 0 ? "c" + i : "";
    if (i >= 0) taken.add(i);
  });
  if (w.buyerOwner === null) w.buyerOwner = w.map.lead || w.map.sponsor || (contacts.length ? "c0" : "");
}
function wzValid(step) {
  const w = ui.wizard;
  if (step === 1) return Boolean(wzAccount() && w.title.trim() && w.start && w.sign && w.live && w.start < w.sign && w.live >= w.sign && !w.loadingContacts);
  if (step === 2) return Boolean(w.tpl);
  return true;
}

function createPlanFromWizard() {

  });

  store.plans.push(plan); ui.wizard = null; switchPlan(plan.id);

// Actions
// Same rule as Task AI's autoAdvanceStatus: the moment someone starts working on an Open task (posts an
// update, replies by email, or moves one of its subtasks forward) it becomes In progress. A status set by
// hand always wins, and a closed task is never reopened by a note. Work on a subtask also starts its main task.
// Returns the names of the tasks that moved, for the confirmation message.
function startWork(t, by = me()) {
  const moved = [];
  for (let x = t; x; x = parentOf(x)) {
    if (x.status !== "Open") continue;
    x.status = "In progress";
    state.activity.unshift({ at: new Date().toISOString().slice(0, 10), by, text: `started work on “${x.title}” (status set to In progress)`, task: x.id });
    moved.push(x.title);
  }
  return moved;
}
const movedText = moved => moved.length ? ` “${moved[0]}”${moved.length > 1 ? ` and “${moved[1]}”` : ""} moved to In progress.` : "";

function setStatus(t, s) {
  if (!t || t.status === s) return;
  t.status = s;
  t.closedAt = s === "Closed" ? new Date().toISOString().slice(0, 10) : null;
  log(s === "Closed" ? `closed “${t.title}”` : `set “${t.title}” to ${s}`, t.id);
  const p = parentOf(t), moved = p && s !== "Open" ? startWork(p) : [];
  save(); render();
  if (moved.length) toast(`Work started:${movedText(moved)}`);
}
function addTask(phase, parent, title, focusTitle = false) {
  const id = "t" + (++state.seq);
  const p = parent && state.tasks.find(x => x.id === parent);
  const due = (p && p.due) || state.phases.find(x => x.id === phase).end;
  state.tasks.push({ id, phase, parent, title, owner: me(), due, status: "Open", shared: p ? p.shared : true, createdBy: me(), updates: [], coworkers: [], recipients: p ? [...(p.recipients || [])] : [] });
  if (parent) ui.expanded.add(parent);
  log(parent ? `added subtask “${title}” to “${p.title}”` : `added “${title}”`, id);
  save();
  if (!parent) { ui.open = id; ui.focusTitle = focusTitle; toast(focusTitle ? "New task added. Type its name" : "Task added. Set the owner and due date"); } else toast("Subtask added");
  render();
}

// Reordering: drag a task card (or use the arrow keys on its grip) to change its place in a phase or move it
// to another phase. The order is the order of the tasks list itself; subtasks travel with their main task.
function openInlineAdd(phaseId, scroll = false) {
  ui.inlineAdd = phaseId; if (ui.filter !== "all") ui.filter = "all";
  render();
  const inp = document.getElementById("inline-" + phaseId);
  if (inp) { if (scroll) inp.scrollIntoView({ behavior: "smooth", block: "center" }); inp.focus({ preventScroll: scroll }); }
}
function addInlineTask(phaseId, title) {
  const id = "t" + (++state.seq), ph = state.phases.find(x => x.id === phaseId);
  state.tasks.push({ id, phase: phaseId, parent: null, title, owner: me(), due: ph.end, status: "Open", shared: true, createdBy: me(), updates: [], coworkers: [], recipients: [] });
  log(`added “${title}”`, id); save();
  ui.justAdded = id; render();
  document.getElementById("inline-" + phaseId)?.focus();
  toast("Task added. Click it to set the owner and due date");
}

function canReorder() { return ui.mode === "seller" || acc().level === "all"; }
function moveTask(id, targetId, after, phaseId) {
  const t = state.tasks.find(x => x.id === id); if (!t || id === targetId) return;
  const target = targetId && state.tasks.find(x => x.id === targetId);
  const phase = target ? target.phase : phaseId;
  const fromPhase = t.phase;
  state.tasks = state.tasks.filter(x => x.id !== id);
  if (target) { const i = state.tasks.indexOf(target); state.tasks.splice(after ? i + 1 : i, 0, t); }
  else { const last = state.tasks.map(x => x.phase === phase && !x.parent).lastIndexOf(true); state.tasks.splice(last + 1, 0, t); }
  if (phase && phase !== fromPhase) { t.phase = phase; state.tasks.forEach(x => { if (x.parent === t.id) x.phase = phase; }); log(`moved “${t.title}” to ${state.phases.find(p => p.id === phase).name}`, t.id); }
  save(); render();
}
// Arrow keys on a card's grip: swap with the previous / next visible task in the same phase.
function nudgeTask(id, dir) {
  const t = state.tasks.find(x => x.id === id);
  const sibs = state.tasks.filter(x => x.phase === t.phase && !x.parent && visible(x));
  const i = sibs.indexOf(t), other = sibs[i + dir]; if (!other) return;
  moveTask(id, other.id, dir > 0);
  document.querySelector(`[data-grip="${id}"]`)?.focus();
}
function wireReorder(app) {
  if (!canReorder()) return;
  const clear = () => app.querySelectorAll(".drop-before, .drop-after, .drop-end").forEach(x => x.classList.remove("drop-before", "drop-after", "drop-end"));
  app.querySelectorAll(".card[data-open]").forEach(card => {
    card.draggable = true;
    card.ondragstart = e => { ui.dragId = card.dataset.open; e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", ui.dragId); } catch (err) {} card.classList.add("dragging"); };
    card.ondragend = () => { card.classList.remove("dragging"); clear(); ui.dragId = null; };
    card.ondragover = e => { if (!ui.dragId) return; e.preventDefault(); e.stopPropagation(); clear(); const r = card.getBoundingClientRect(); card.classList.add(e.clientY > r.top + r.height / 2 ? "drop-after" : "drop-before"); };
    card.ondrop = e => { e.preventDefault(); e.stopPropagation(); const after = card.classList.contains("drop-after"); clear(); if (ui.dragId) moveTask(ui.dragId, card.dataset.open, after); };
  });
  app.querySelectorAll(".cards[data-phase]").forEach(box => {
    box.ondragover = e => { if (!ui.dragId) return; e.preventDefault(); clear(); box.classList.add("drop-end"); };
    box.ondragleave = e => { if (!box.contains(e.relatedTarget)) box.classList.remove("drop-end"); };
    box.ondrop = e => { e.preventDefault(); clear(); if (ui.dragId) moveTask(ui.dragId, null, true, box.dataset.phase); };
  });
  app.querySelectorAll("[data-grip]").forEach(g => {
    g.onclick = e => e.stopPropagation();
    g.onkeydown = e => { if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); e.stopPropagation(); nudgeTask(g.dataset.grip, e.key === "ArrowUp" ? -1 : 1); } };
  });
}

$("#mode-seller").onclick = () => { ui.mode = "seller"; ui.open = null; ui.filter = "all"; try { localStorage.setItem(STORE_KEY + ":mode", "seller"); } catch (e) {} render(); };
$("#mode-buyer").onclick = () => { ui.mode = "buyer"; ui.open = null; ui.filter = "all"; ui.addFor = null; ui.removing = null; try { localStorage.setItem(STORE_KEY + ":mode", "buyer"); } catch (e) {} render(); };
$("#reset").onclick = () => { store = freshStore(); state = store.plans[0]; ui.wizard = null; ui.open = null; ui.expanded = new Set(); save(); render(); toast("Demo data reset"); };
document.addEventListener("click", e => {
  if ((ui.phaseMenu || ui.planMenu) && !e.target.closest(".ph-tools")) { ui.phaseMenu = null; ui.planMenu = false; render(); }
  if (ui.picker && !e.target.closest(".pfield")) { ui.picker = null; render(); }
});
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (ui.phaseMenu) { ui.phaseMenu = null; render(); return; } if (ui.inviteFor) { ui.inviteFor = null; renderInvite(); } else if (ui.digestFor && ui.manage) { ui.digestFor = null; renderDigest(); } else if (ui.manage) { ui.manage = null; ui.removing = null; renderManage(); } else if (ui.ask) { ui.ask = null; renderAsk(); } else if (ui.digestFor) { ui.digestFor = null; renderDigest(); } else if (ui.open) closeDrawer(); });
ui.expanded.add(state.tasks.find(t => t.title === "Proof of concept")?.id);
loadAppUsers();
render();
</script>
