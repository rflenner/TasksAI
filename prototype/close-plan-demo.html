/* Shell */
.shell { display: flex; min-height: 100vh; }
.side { position: fixed; inset: 0 auto 0 0; width: 246px; background: #fff; border-right: 1px solid var(--line); padding: 34px 22px; display: flex; flex-direction: column; }
.logo { font-size: 32px; font-weight: 800; color: var(--navy); padding: 0 15px 38px; }
.logo b { font-size: 20px; background: var(--orange); color: #fff; padding: 7px 6px; border-radius: 5px; margin-left: 4px; vertical-align: 5px; }
.side nav { display: grid; gap: 7px; align-content: start; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.side nav button { border: 0; background: none; color: #5d6470; padding: 13px 14px; border-radius: 9px; display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; }
.side nav button:hover { background: #f3f6fa; }

.att-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #eef1f5; }

.att-main { flex: 1; min-width: 0; }

.att-name { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--navy); cursor: pointer; text-align: left; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.att-name:hover { text-decoration: underline; }

.att-up { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.pv-overlay { position: fixed; inset: 0; background: rgba(16, 28, 45, .62); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 18px; }
.pv { background: #fff; border-radius: 12px; width: min(980px, 100%); height: 100%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.pv-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #e3e8ee; font-size: 13px; }
.pv-bar b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--navy); }
.pv-bar button, .pv-bar a { border: 1px solid #c9d3e0; background: #fff; border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 12.5px; cursor: pointer; color: #2b3445; text-decoration: none; }
.pv-body { flex: 1; overflow: auto; background: #e9edf2; padding: 14px; }
.pv-body canvas { display: block; margin: 0 auto 12px; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.2); max-width: none; }
.pv-msg { text-align: center; color: #5b6677; margin: 40px 0; }
.nav-children { display: grid; gap: 3px; margin: -2px 0 7px 34px; padding: 4px 0 5px 12px; border-left: 1px solid #dbe3ed; }
.side nav .nav-children button { padding: 7px 8px; border-radius: 6px; color: #747d89; font-size: 12px; justify-content: space-between; gap: 7px; }
.side nav .nav-children button.current { background: #eef4fc; color: var(--navy); font-weight: 700; }
.side nav .nav-children em { background: transparent; padding: 0; color: #9aa2ad; }
.nav-new { font-size: 9px !important; font-weight: 800; background: var(--orange) !important; color: #fff; letter-spacing: .4px; }
.side-foot { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 14px 8px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.side-foot b { display: block; color: var(--ink); font-size: 13px; }
.main { margin-left: 246px; flex: 1; min-width: 0; }
.content { max-width: 1420px; margin: auto; padding: 40px 42px 80px; }

/* Shared (buyer) header */
.ext-head { background: #fff; border-bottom: 1px solid var(--line); padding: 16px 42px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.ext-head .logo { font-size: 24px; padding: 0; }
.ext-head .logo b { font-size: 15px; padding: 5px 5px; vertical-align: 3px; }
.ext-who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.ext-who select { border: 1px solid var(--field); border-radius: 8px; padding: 6px 8px; background: #fff; }

/* Demo switch: sits above both views */
.demo-bar { background: var(--dark); color: #dfe7f2; font-size: 12px; padding: 7px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.demo-bar .tabs { background: transparent; border-color: #2c4c78; }
.demo-bar .tabs button { color: #b9c7da; padding: 4px 12px; font-size: 12px; }
.demo-bar .tabs .on { background: #fff; color: var(--navy); }
.demo-bar .link { border: 0; background: none; color: #b9c7da; text-decoration: underline; font-size: 12px; }

/* Page title */
.title { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-bottom: 30px; }
.title > div:first-child { flex: 1; min-width: 0; }
.title label { color: var(--navy); font-size: 11px; letter-spacing: 1.5px; font-weight: 800; }
.plan-title { font: inherit; color: inherit; background: transparent; border: 0; border-bottom: 1px dashed transparent; width: 100%; padding: 0; text-wrap: balance; }
.plan-title:hover, .plan-title:focus { border-bottom-color: #9aa9bf; outline: none; }
.title h1 { font-size: 34px; color: var(--dark); margin: 8px 0; line-height: 1.15; text-wrap: balance; }
.title p { color: var(--muted); margin: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; }
.title p b { color: var(--ink); }
.title-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; } .title-top label { white-space: nowrap; } .title { position: relative; } .title-status { flex: none; position: absolute; right: 0; top: -6px; }
.title-status { display: inline-flex; align-items: center; gap: 12px; }
.title-status .save-state { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0; }
.title-meta { display: flex; flex-wrap: wrap; gap: 10px 32px; margin-top: 2px; }
.title-meta small { display: block; font-size: 11px; color: var(--hint); margin-bottom: 2px; }
.title-meta b { font-size: 14px; color: var(--ink); font-weight: 700; }
.icon-btn { width: 42px; padding: 0; justify-content: center; flex: none; } .icon-btn svg { flex: none; }
.sf-cloud { position: relative; display: inline-block; width: 22px; height: 15px; flex: none; }
.sf-cloud > svg:first-child { position: absolute; inset: 0; width: 100%; height: 100%; }
.sf-cloud > svg:last-child { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; color: #fff; }
.title-status .sf-chip.ok { background: none; border-color: transparent; color: var(--navy); } .title-status .sf-chip.ok:hover { background: #eef4fc; }
.opp-name { font-size: 12px; font-weight: 700; color: var(--navy); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sf-chip.spin .sf-cloud > svg:last-child { animation: sfspin .9s linear infinite; transform-origin: 50% 50%; }
@keyframes sfspin { to { transform: rotate(360deg); } }
.sf-chip.warn .sf-cloud > svg:first-child, .sf-chip.bad .sf-cloud > svg:first-child { opacity: .55; }
@media (prefers-reduced-motion: reduce) { .sf-chip.spin .sf-cloud > svg:last-child { animation: none; } }
.sf-chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 12px 3px 5px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid; }
.sf-chip.ok { background: #eaf6ef; color: #25784b; border-color: #cfe9da; } .sf-chip.warn { background: #fff4de; color: #9b5d00; border-color: #f3dca9; } .sf-chip.bad { background: #fdecea; color: #a8402f; border-color: #f1c6bf; }
.crm-chip { display: inline-flex; align-items: center; gap: 6px; background: #eef4fc; color: var(--navy); border: 1px solid #dce7f5; border-radius: 14px; padding: 3px 9px; font-size: 11px; font-weight: 700; }
.title-actions [data-tip] { position: relative; }
.title-actions [data-tip]::after { content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 50%; transform: translate(-50%, -2px); background: var(--dark); color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; padding: 5px 9px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .12s, transform .12s; z-index: 30; }
.title-actions [data-tip]:hover::after, .title-actions [data-tip]:focus-visible::after { opacity: 1; transform: translate(-50%, 0); transition-delay: .25s; }
.title-actions .ph-btn[data-tip]::after { left: auto; right: 0; transform: translateY(-2px); } .title-actions .ph-btn[data-tip]:hover::after, .title-actions .ph-btn[data-tip]:focus-visible::after { transform: none; }
.title-actions .ph-btn.on::after { display: none; }
.title-actions { display: flex; gap: 10px; align-items: center; flex: none; }
.btn { height: 42px; border: 1px solid #d7dce3; background: #fff; border-radius: 8px; padding: 0 18px; font-weight: 700; color: var(--navy); display: inline-flex; align-items: center; gap: 8px; }
.btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.tabs { display: inline-flex; padding: 3px; border: 1px solid var(--field); background: #fff; border-radius: 8px; }
.tabs button { border: 0; background: none; padding: 8px 17px; color: #6c7480; border-radius: 6px; }
.tabs .on { background: #eaf1fb; color: var(--navy); font-weight: 700; }

/* Stats */
/* Progress versus plan (iSEEit only): the Plan progress tile is twice as wide as the others and holds the score, the forecast signature date and a mini graph. */
.stats.has-prog { grid-template-columns: 2fr 1fr 1fr 1fr; }
.stat-prog { display: grid; gap: 0; cursor: pointer; text-align: left; align-content: start; }
.pg-top { display: grid; grid-template-columns: minmax(120px, auto) minmax(110px, 1fr); gap: 4px 16px; align-items: center; }
.pg-text { display: grid; gap: 2px; align-content: start; } .stat-prog .pg-title { color: var(--muted); font-size: 13px; } .stat-prog .pg-score { font-size: 34px; color: var(--navy); line-height: 1.1; } .stat-prog small { color: var(--muted); font-size: 12px; }
.pg-mini { min-width: 0; } .pg-svg { width: 100%; height: auto; display: block; } .pg-svg text { font: 9.5px Arial, Helvetica, sans-serif; fill: #8a919c; }
.pg-sep { border-top: 1px solid #e3e8ee; margin: 12px 0 10px; }
.pg-bottom { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pg-badge { display: inline-flex; align-items: center; height: 34px; box-sizing: border-box; font-size: 12px; font-weight: 700; border-radius: 10px; padding: 0 12px; line-height: 1.2; white-space: nowrap; } .pg-badge.ok { background: #e4f4eb; color: #25784b; } .pg-badge.late { background: #fdecd8; color: #b25c00; }
.pg-fcbox { display: grid; align-content: center; height: 34px; box-sizing: border-box; border: 1px solid #dfe5ec; border-radius: 10px; padding: 0 12px; background: #f8fafc; line-height: 1.15; } .stat-prog .pg-fcbox small { font-size: 9.5px; text-transform: uppercase; letter-spacing: .4px; color: #7a8492; } .stat-prog .pg-fcbox b { font-size: 13px; margin: 0; display: block; } .stat-prog .pg-fcbox .late { color: #b25c00; } .stat-prog .pg-fcbox .ok { color: #25784b; }
.pg-toggle { margin: 0 0 0 auto; border: 0; background: none; color: var(--navy); font-weight: 700; font-size: 12.5px; padding: 2px 0; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.pg-card { grid-column: 1 / -1; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; }
.pg-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: #6f7885; justify-content: flex-end; margin-bottom: 4px; } .pg-legend span { display: inline-flex; align-items: center; gap: 6px; } .pg-legend i { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
.pg-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; } .pg-card .pg-legend { margin: 0 0 2px; }
.pg-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; } .pg-facts div { background: #f5f8fc; border-radius: 8px; padding: 6px 10px; font-size: 12px; color: #4a5160; line-height: 1.4; } .pg-facts div > b { display: block; color: #173f76; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 2px; } .pg-facts small { color: #7a8492; font-size: 11px; } .pg-facts .pg-wide { grid-column: 1 / -1; }
.pg-late { color: #b25c00; font-weight: 700; } .pg-ok { color: #25784b; font-weight: 700; } .pg-note { margin: 6px 0 0; font-size: 11px; color: #8a919c; }
@media (max-width: 900px) { .pg-grid { grid-template-columns: 1fr; } }
@media (max-width: 1180px) { .stats.has-prog { grid-template-columns: repeat(3, 1fr); } .stat-prog { grid-column: 1 / -1; } }
@media (max-width: 560px) { .stats.has-prog { grid-template-columns: 1fr 1fr; } }
@media (max-width: 480px) { .stat-prog { grid-template-columns: 1fr; } }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; text-align: left; transition: border-color .15s, box-shadow .15s, transform .15s; }
.stat:hover { border-color: #b8c6da; box-shadow: 0 5px 18px #173f7610; transform: translateY(-1px); }
.stat.active { border-color: var(--navy); box-shadow: 0 0 0 2px #173f7620; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 700; display: block; }
.stat b { display: block; font-size: 28px; color: var(--navy); margin: 7px 0 4px; font-variant-numeric: tabular-nums; }
.stat small { color: var(--hint); }
.stat.warn { border-top: 3px solid var(--orange); padding-top: 16px; }
.stat.warn b { color: #c87300; }

/* Phase timeline */

/* Filter bar (Task AI dimension bar) */
.dimension-bar { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 16px 0 4px; }
.dimension-bar > b { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: #8a919c; margin-right: 5px; white-space: nowrap; }
.dimension-bar button { border: 1px solid #dce2ea; background: #fff; color: #657080; border-radius: 18px; padding: 7px 11px; white-space: nowrap; font-size: 12px; }
.dimension-bar button.on { background: #eaf1fb; border-color: #b8cce4; color: var(--navy); font-weight: 700; }
.dimension-bar em { font-style: normal; background: #f0f2f5; border-radius: 10px; padding: 1px 6px; margin-left: 7px; font-size: 10px; }

/* Two columns */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 26px; align-items: start; }

/* Phase groups */
.group { margin-top: 28px; }
.group-title { display: flex; gap: 11px; align-items: center; margin: 0 0 12px 5px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #e7eef8; color: var(--navy); display: inline-grid; place-items: center; font-weight: 700; flex: none; }
.avatar { position: relative; overflow: hidden; }
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.pphoto { position: relative; flex: none; }
.pphoto-btn { position: relative; display: block; padding: 0; border: 0; background: none; border-radius: 50%; cursor: pointer; }
.pphoto-edit { position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1px solid var(--line); color: var(--navy); font-size: 11px; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
.pphoto-btn:hover .pphoto-edit, .pphoto-btn:focus-visible .pphoto-edit, .pphoto.open .pphoto-edit { opacity: 1; }
.pphoto .ph-menu { left: 0; right: auto; }
.pphoto-src { margin: 4px 10px 2px; font-size: 12px; color: var(--muted); }
.group-title .avatar { width: 35px; height: 35px; font-size: 13px; }
.group.current .group-title .avatar { background: var(--navy); color: #fff; }
.group.complete .group-title .avatar { background: #e4f4eb; color: var(--green); }
.group-title h2 { font-size: 15px; color: var(--dark); margin: 0 0 2px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.group-title small { color: #9097a1; display: block; }
.group-title .gt-right { margin-left: auto; text-align: right; font-size: 11px; color: #9097a1; white-space: nowrap; }
.pbar { width: 110px; height: 5px; border-radius: 5px; background: #e4eaf1; overflow: hidden; margin: 5px 0 0 auto; }
.pbar i { display: block; height: 100%; background: var(--green); }
.ph-fold { border: 0; background: transparent; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: #6b7482; cursor: pointer; flex: none; padding: 0; }
.ph-fold:hover { background: #e8edf3; color: var(--navy); }
.ph-fold svg { transition: transform .15s; }
.group.folded .ph-fold svg { transform: rotate(-90deg); }
.ph-head { min-width: 0; cursor: pointer; }
.group.folded { margin-top: 12px; }
.group.folded .group-title { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 10px 8px; margin: 0; }
.group.folded .group-title:hover { border-color: var(--soft-line); }
.ph-sum { color: #697181; display: block; font-size: 12px; }
.ph-sum .late { color: var(--late); font-weight: 700; }
.fold-all { display: flex; justify-content: flex-end; gap: 4px; margin: 18px 0 -14px; font-size: 12px; }
.fold-all button { border: 0; background: transparent; color: var(--navy); font-weight: 700; cursor: pointer; padding: 3px 6px; border-radius: 6px; font-size: 12px; }
.fold-all button:hover { background: #e8edf3; }
.pdf-btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; font-size: 14px; }
.vx-btn { position: fixed; z-index: 60; bottom: 22px; right: 22px; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #d7dce3; background: #fff; color: var(--navy); font-weight: 700; font-size: 14px; box-shadow: 0 8px 30px rgba(16,47,89,.18); cursor: pointer; }
.vx-btn:hover { border-color: var(--navy); }
/* Task AI's Live Voice Assistant icon: seven sound bars. The floating launcher shows once the page is scrolled away from the top. */
.vx-wave { display: block; flex: none; } .vx-wave.live line { transform-box: fill-box; transform-origin: center; animation: vx-wave 1.1s ease-in-out infinite; } .vx-wave.live line:nth-child(2n) { animation-delay: -.35s; } .vx-wave.live line:nth-child(3n) { animation-delay: -.7s; }
@keyframes vx-wave { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } } @media (prefers-reduced-motion: reduce) { .vx-wave.live line { animation: none; } }
.vx-fab { position: fixed; z-index: 55; bottom: 22px; right: 22px; width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--navy); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 8px 30px rgba(16,47,89,.3); opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .18s, transform .18s; }
.vx-fab.show { opacity: 1; transform: none; pointer-events: auto; } .vx-fab:hover { background: #0f2f5c; }
.vx-fab::after { content: attr(data-tip); position: absolute; right: 0; bottom: calc(100% + 8px); background: var(--dark); color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; padding: 5px 9px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .12s; } .vx-fab:hover::after, .vx-fab:focus-visible::after { opacity: 1; transition-delay: .25s; }
.vx-fab.left { right: auto; left: 22px; } .vx-fab.left::after { right: auto; left: 0; }
@media print { .vx-fab { display: none !important; } }
.vx-panel { position: fixed; z-index: 60; bottom: 22px; right: 22px; width: min(320px, calc(100vw - 32px)); background: #fff; border: 1px solid #e3e8ee; border-radius: 16px; box-shadow: 0 8px 30px rgba(16,47,89,.2); padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.vx-panel.left, .vx-btn.left { right: auto; left: 22px; }
.vx-head { display: flex; align-items: center; gap: 8px; }
.vx-head h2 { font-size: 14px; color: var(--dark); margin: 0; flex: 1; }
.vx-dot { width: 10px; height: 10px; border-radius: 50%; background: #c96539; flex: none; }
.vx-dot.on { background: var(--green); animation: vxpulse 1.6s infinite; }
.vx-dot.bad { background: #a84235; }
@keyframes vxpulse { 50% { opacity: .45; } }
.vx-x { border: 0; background: transparent; width: 28px; height: 28px; border-radius: 50%; color: #697181; font-size: 16px; cursor: pointer; }
.vx-x:hover { background: #f1f3f7; }
.vx-screen { font-size: 11px; font-weight: 700; color: var(--navy); background: #eef3fa; border-radius: 6px; padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vx-feed { max-height: 34vh; min-height: 56px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.vx-feed .vx-hint { color: #8b929d; font-size: 12px; }
.vx-item { max-width: 90%; border-radius: 9px; padding: 6px 10px; line-height: 1.4; }
.vx-item.heard { align-self: flex-end; background: var(--navy); color: #fff; }
.vx-item.heard.pending { opacity: .8; }
.vx-item.result { align-self: flex-start; background: #f1f3f7; color: var(--ink); }

// Do any two phases share at least one day?
function overlapping() {

// Gantt-style timeline: one row per phase in plan order, positioned on a shared date axis, so overlaps are visible.
function timelineBlock() {
  const phases = state.phases;

  const startMs = Math.min(...phases.map(p => d(p.start).getTime()), ...ms.map(t => d(t.due).getTime())) - 3 * 864e5;
  const endMs = Math.max(...phases.map(p => d(p.end).getTime()), ...ms.map(t => d(t.due).getTime())) + 4 * 864e5;
  const pct = ms => (ms - startMs) / (endMs - startMs) * 100;

  const todayPos = pct(TODAY.getTime());

  const msLane = ms.length ? `<div class="g-lane g-lane-ms">${grid}${ms.map(t => {

    const edge = x < 18 ? "tip-left" : x > 82 ? "tip-right" : "";
    return `<button type="button" class="ms-mark ${st} ${mv ? "moved" : ""}" data-kd="${t.id}" style="left:${x}%" aria-label="Milestone ${esc(t.title)}, ${fmtY(t.due)}${mv ? `, moved ${shiftText(mv)}` : ""}"><i class="ms-dot"></i>
      <span class="ms-tip ${edge}" role="tooltip"><span class="kd ${st}"><i class="ms-dot"></i><span class="kd-name">${esc(t.title)}</span><span class="kd-date">${t.status === "Closed" ? "Done" : isOver(t) ? `Overdue · ${fmt(t.due)}` : fmtY(t.due)}</span>${mv ? `<span class="kd-moved">moved ${shiftText(mv)}</span>` : ""}</span>${mv ? `<span class="ms-tip-sub">From ${fmt(mv.from)} · changed by ${esc(person(mv.by).name)} on ${fmt(mv.at)}</span>` : ""}</span></button>`;
  }).join("")}</div>` : "";

    }).join("");

  }

    const done = ts.length ? ts.filter(t => t.status === "Closed").length / ts.length : 0;

      <div class="g-lane">${grid}
        <button type="button" class="g-bar ${isCurrent(ph) ? "current" : ""}" data-jump="${ph.id}" style="left:${left}%;width:${width}%" title="${esc(ph.name)}: ${fmtY(ph.start)} – ${fmtY(ph.end)}, ${Math.round(done * 100)}% closed">

// Phases fold away to keep long plans digestible. By default the current phase(s), past phases with open
// tasks and any phase with an overdue task are open; future and finished phases are folded. When no phase is current (before the plan starts or
// between phases) the next phase to start is open. With a filter on, phases with a match are open. A viewer's
// own choice wins and is remembered per plan in this browser only.
const CHEVRON = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
function phaseChoices() {

    ui.foldFor = state.id; ui.fold = {};

  }
  return ui.fold;
}
function setPhaseOpen(ids, open) {
  const c = phaseChoices(); ids.forEach(id => { c[id] = open; });
  try { localStorage.setItem(`${STORE_KEY}:fold:${state.id}`, JSON.stringify(c)); } catch (e) {}
}
function phaseOpenByDefault(ph, all, tops) {
  if (ui.filter !== "all") return tops.length > 0;
  if (isCurrent(ph) || all.some(t => t.status !== "Closed" && matches(t, "overdue"))) return true;
  if (d(ph.end) < TODAY) return all.some(t => t.status !== "Closed");
  if (state.phases.some(isCurrent)) return false;
  const next = state.phases.filter(p => d(p.start) > TODAY).sort((a, b) => d(a.start) - d(b.start))[0];
  return next === ph;
}
function phaseIsOpen(ph, all, tops) {
  if (ui.editPhase === ph.id || ui.inlineAdd === ph.id) return true;
  const c = phaseChoices()[ph.id];
  return c === undefined ? phaseOpenByDefault(ph, all, tops) : c;
}
function phaseSummary(all) {

  const next = open.filter(t => t.due).sort((a, b) => d(a.due) - d(b.due))[0];

  if (!open.length) return "All tasks closed";

}

function wirePhases(app) {
  app.querySelectorAll("[data-phmenu]").forEach(b => b.onclick = e => { e.stopPropagation(); ui.phaseMenu = ui.phaseMenu === b.dataset.phmenu ? null : b.dataset.phmenu; render(); });
  const startDelete = id => {
    if (!state.tasks.some(t => t.phase === id)) { deletePhaseNow(id, null); return; }
    Object.assign(ui, { phaseMenu: null, editPhase: id, deletePhase: id, deleteConfirm: false, deleteTo: null }); render();
    document.querySelector(".del-box")?.scrollIntoView({ block: "nearest" });
  };
  app.querySelectorAll("[data-phdelete]").forEach(b => b.onclick = () => startDelete(b.dataset.phdelete));
  app.querySelectorAll("[data-phmove]").forEach(b => b.onclick = () => {

    const [id, dir] = b.dataset.phmove.split(":"), i = state.phases.findIndex(p => p.id === id), j = i + Number(dir);
    if (j < 0 || j >= state.phases.length) return;
    const [ph] = state.phases.splice(i, 1); state.phases.splice(j, 0, ph);
    log(`moved phase “${ph.name}” ${Number(dir) < 0 ? "up" : "down"}`, null); save(); render();
    document.getElementById("ph-" + id)?.scrollIntoView({ block: "nearest" });
  });
  app.querySelectorAll("[data-phedit]").forEach(b => b.onclick = () => { ui.phaseMenu = null; ui.editPhase = ui.editPhase === b.dataset.phedit ? null : b.dataset.phedit; ui.deletePhase = null; render(); $("#pe-name")?.focus(); });

  f.querySelector("[data-pe-cancel]").onclick = () => { Object.assign(ui, { editPhase: null, deletePhase: null, deleteConfirm: false, deleteTo: null }); render(); };
  const del = f.querySelector("[data-pe-delete]"); if (del) del.onclick = () => startDelete(f.dataset.phase);
  const mt = $("#pe-moveto"); if (mt) mt.onchange = () => { ui.deleteTo = mt.value; };
  const ask = f.querySelector("[data-pe-delete-ask]"); if (ask) ask.onclick = () => { ui.deleteTo = $("#pe-moveto").value; ui.deleteConfirm = true; render(); };
  f.querySelectorAll("[data-pe-delete-cancel]").forEach(b => b.onclick = () => { Object.assign(ui, { deletePhase: null, deleteConfirm: false, deleteTo: null }); render(); });
  const delOk = f.querySelector("[data-pe-delete-confirm]"); if (delOk) delOk.onclick = () => deletePhaseNow(f.dataset.phase, ui.deleteTo || neighbourOf(f.dataset.phase));
  f.onsubmit = e => {
    e.preventDefault();
    const name = $("#pe-name").value.trim(), start = $("#pe-start").value, end = $("#pe-end").value, goal = $("#pe-goal").value.trim();
    if (!name || !start || !end) return;
    if (end < start) { $("#pe-err").hidden = false; return; }
    if (f.dataset.phase === "new") {
      const ph = { id: "ph" + (++state.seq), name, goal, start, end };
      state.phases.push(ph); log(`added phase “${name}”`, null); toast(`Phase “${name}” added`);
    } else {
      const ph = state.phases.find(p => p.id === f.dataset.phase);
      const changes = [ph.name !== name ? "name" : "", ph.goal !== goal ? "description" : "", ph.start !== start || ph.end !== end ? "dates" : ""].filter(Boolean);
      Object.assign(ph, { name, goal, start, end });
      if (changes.length) log(`changed the ${changes.join(", ")} of phase “${name}”`, null);
    }
    ui.editPhase = null; save(); render();
  };
}

function statsFor(id) {
  const items = state.tasks.filter(t => visible(t) && (t.owner === id || (t.coworkers || []).includes(id) || (t.recipients || []).includes(id)));
  const week = new Date(TODAY); week.setDate(week.getDate() + 7);
  const closed = items.filter(t => t.status === "Closed").length;
  const overdue = items.filter(isOver).length;
  const dueWeek = items.filter(t => t.status !== "Closed" && !isOver(t) && t.due && d(t.due) <= week).length;
  const open = items.length - closed - overdue - dueWeek;
  return { total: items.length, closed, overdue, dueWeek, open,
    owner: items.filter(t => t.owner === id).length, coworker: items.filter(t => (t.coworkers || []).includes(id)).length, recipient: items.filter(t => (t.recipients || []).includes(id)).length };
}

// ---- Adding people to a plan (plan owners and administrators) ----
// iSEEit side: active Task AI users. Customer side: the account's contacts from Sales AI, an active Task AI user
// (a vendor or partner on the customer side), or someone new by hand. Everyone gets a role on the plan. The lists
// come from /api/close-plans/store/:id/people-options, which is allowed for the plan owner (the new-plan guide's
// own lookups are admin-only), so a plan owner who isn't an administrator can add people too.
const ROLE_ORDER = { buyer: ["sponsor", "lead", "tech", "security", "procurement", "legal", "users"], seller: ["ae", "se", "cs", "pm", "design", "dev"] };
// The role list is defined by Site Admins (Admin → Close Plan roles) and fetched at boot; until then (or in the stand-alone demo) the built-in names apply.
let ROLE_LIST = null;
const roleLabels = side => ROLE_LIST ? ROLE_LIST.filter(r => r.side === side).map(r => r.name) : (ROLE_ORDER[side] || []).map(k => ROLES[k].label);
function applyRoleList(list) {
  ROLE_LIST = list;
  list.forEach(r => { if (r.key && ROLES[r.key]) ROLES[r.key].label = r.name; });
}
async function loadRoleList() {
  try { const r = await fetch("/api/close-plans/roles", { credentials: "same-origin" }); if (r.ok) applyRoleList((await r.json()).roles || []); } catch (e) {}
}
// A role picker. A person whose role is no longer in the list keeps it, marked as such, so nothing is lost silently.
function roleSelect(attrs, side, current) {
  const names = roleLabels(side), cur = (current || "").trim(), stale = cur && !names.includes(cur);
  return `<select ${attrs}><option value="">No role</option>${names.map(n => `<option value="${esc(n)}"${n === cur ? " selected" : ""}>${esc(n)}</option>`).join("")}${stale ? `<option value="${esc(cur)}" selected>${esc(cur)} (not in the role list)</option>` : ""}</select>`;
}
// A role suggested from a job title, using the same patterns the new-plan guide uses (most specific first).
function suggestRole(title) {
  // Only strong matches: the first pattern of the technical and project roles (their second patterns, like
  // "specialist" or "operations", are too loose to suggest a role from); an executive or director counts for sponsor.
  for (const k of ["security", "procurement", "legal", "sponsor", "tech", "lead", "users"]) {
    const m = ROLES[k].match; if (!m) continue;
    const patterns = Array.isArray(m) ? (k === "tech" || k === "lead" ? m.slice(0, 1) : m) : [m];
    if (patterns.some(re => re.test(title || ""))) return ROLES[k].label;
  }
  return "";
}
function loadPeopleOptions(force) {
  const cur = ui.peopleOpts;

}

function personTasks(p) {

    return `<div class="ptask ${t.status === "Closed" ? "done" : ""}">

// Inside Task AI a personal link is real: the server creates it (iSEEit plan owner only) and it's copied for
// the plan owner to send. Invitation emails come later; until then the link goes out in their own email.
async function flushPlanSave() {
  if (!IN_APP || !state || state._demo) return;
  if (sync.timers[state.id]) { clearTimeout(sync.timers[state.id]); sync.timers[state.id] = null; if (sync.dirty[state.id]) await pushPlan(state); }
  for (let i = 0; i < 25 && (sync.inflight[state.id] || sync.dirty[state.id]); i++) await new Promise(r => setTimeout(r, 200));
}
async function copyPersonalLink(p, invite = false) {
  try {
    await flushPlanSave();
    const r = await fetch(`/api/close-plans/store/${encodeURIComponent(state.id)}/links`, { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ personId: p.id }) });
    const res = await r.json().catch(() => ({}));
    if (!r.ok || !res.url) throw new Error(res.error || "");
    let copied = true; try { await navigator.clipboard.writeText(res.url); } catch (e) { copied = false; }
    if (!p.invite || p.invite.status === "none") { p.invite = { status: "invited", at: new Date().toISOString().slice(0, 10) }; log(`${invite ? "invited" : "created a personal link for"} ${p.name}`, null); save(); render(); renderManage(); }
    if (copied) toast(`Personal link for ${p.name} copied. Paste it into your email; it works for 60 days.`);
    else window.prompt(`Personal link for ${p.name} (works for 60 days):`, res.url);
    return true;
  } catch (e) { toast(e.message || "The link could not be created. Try again."); return false; }
}

  root.querySelectorAll("[data-sa-email]").forEach(i => i.onchange = () => {

  });
  const bindSf = () => root.querySelectorAll("[data-sa-sf]").forEach(b => b.onclick = () => {
    const c = ui.peopleOpts.contacts[+b.dataset.saSf]; if (!c || onPlan(c)) return;
    const id = "p" + (++state.seq);
    state.people.push({ id, name: c.name, email: c.email || "", title: c.title || "", role: "", side: "buyer", ...(c.contactIds && c.contactIds.length ? { contactIds: c.contactIds } : {}), access: { ...ACCESS_DEFAULTS.buyer }, invite: { status: "none" } });
    log(`added ${c.name} to the ${B()} team`, null); if (c.email) q.picked = [...q.picked, id]; q.search = ""; save(); renderShareAll(); render();
  });
  const bindManual = () => root.querySelectorAll("[data-sa-manual]").forEach(b => b.onclick = () => { q.adding = true; renderShareAll(); const n = document.getElementById("sa-name"); if (n) { n.value = q.search || ""; n.focus(); } });
  bindSf(); bindManual();
  const srch = root.querySelector("#sa-search"); if (srch) srch.oninput = () => { q.search = srch.value; root.querySelector("#sa-results").innerHTML = saResults(q); bindSf(); bindManual(); };
  const addCancel = root.querySelector("#sa-add-cancel"); if (addCancel) addCancel.onclick = () => { q.adding = false; renderShareAll(); };
  const form = root.querySelector("#sa-form");
  if (form) form.onsubmit = e => {
    e.preventDefault();
    const name = form.querySelector("#sa-name").value.trim(), email = form.querySelector("#sa-email").value.trim(), title = form.querySelector("#sa-title").value.trim();
    if (!name || !email) return;
    const id = "p" + (++state.seq);
    state.people.push({ id, name, email, title, role: "", side: "buyer", access: { ...ACCESS_DEFAULTS.buyer }, invite: { status: "none" } });
    log(`added ${name} to the ${B()} team`, null); q.picked = [...q.picked, id]; q.adding = false; save(); renderShareAll(); render();
  };
  const send = root.querySelector("#sa-send");
  send.onclick = async () => {
    q.busy = true; renderShareAll();
    const today = new Date().toISOString().slice(0, 10), people = q.picked.map(person), notSent = [];
    let sent = 0;
    for (const p of people) {
      if (!IN_APP || state._demo) { p.invite = { status: "invited", at: today }; log(`invited ${p.name}`, null); sent++; continue; }
      try {
        await flushPlanSave();
        const r = await fetch(`/api/close-plans/store/${encodeURIComponent(state.id)}/invite`, { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ personId: p.id }) });
        const res = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(res.error || "The invitation could not be sent.");
        // Not emailed (switched off, opted out, no sending set up): the personal link exists, so they count as invited
        // and their link can be copied from the People tab.
        p.invite = { status: "invited", at: today };
        if (res.sent) { log(`invited ${p.name}`, null); sent++; } else { log(`created a personal link for ${p.name}`, null); notSent.push(res.reason || p.name); }
      } catch (e) { notSent.push(`${p.name}: ${e.message || "failed"}`); }
    }
    q.busy = false; save(); ui.shareAll = null; renderShareAll(); render(); if (typeof renderManage === "function") renderManage();
    toast(notSent.length ? `${sent ? `${sent} invited. ` : ""}${notSent.length} could not be emailed: ${notSent[0]}. Copy their personal links from the People tab.` : sent === 1 ? `Invitation sent to ${people[0].name}` : `${sent} invitations sent`);
  };
}

// Recent activity: a short summary of the last 7 days on top (AI inside Task AI, rule-based elsewhere or as
// a fallback), and the full list behind "Show all activity", grouped by day with repeated entries merged.
function activityItems() { return state.activity.filter(a => { if (!a.task) return true; const t = state.tasks.find(x => x.id === a.task); return t ? visible(t) : ui.mode === "seller"; }); }
function lastWeek(items) { const since = addDays(isoOf(TODAY), -7); return items.filter(a => a.at >= since); }
function ruleSummary(items) {
  if (!items.length) return "No activity in the last 7 days.";
  const count = re => items.filter(a => re.test(a.text)).length;
  const names = [...new Set(items.map(a => person(a.by).name))];
  const who = names.length <= 2 ? names.join(" and ") : `${names.slice(0, 2).join(", ")} and ${names.length - 2} other${names.length > 3 ? "s" : ""}`;
  const closedTitles = items.filter(a => /^closed “/.test(a.text)).map(a => a.text.match(/“(.+?)”/)?.[1]).filter(Boolean).slice(0, 2);
  const msMoved = items.filter(a => /^moved milestone “/.test(a.text)).map(a => a.text.match(/“(.+?)”/)?.[1]).filter(Boolean);
  const n = (k, one, many) => k ? `${k} ${k === 1 ? one : many}` : "";
  const parts = [
    n(count(/^closed “/), "task closed", "tasks closed") + (closedTitles.length ? ` (${closedTitles.join(", ")})` : ""),
    n(count(/^posted an update|^replied by email/), "status update", "status updates"),
    n(count(/^added “/), "new task", "new tasks"),
    n(count(/^added subtask/), "new subtask", "new subtasks"),
    msMoved.length ? `${n(msMoved.length, "milestone moved", "milestones moved")} (${msMoved.slice(0, 2).join(", ")})` : "",
    n(count(/^moved “.+” (from|to) \d/), "date changed", "dates changed"),
    n(count(/^assigned |as coworker on|as requester on/), "people change on tasks", "people changes on tasks"),
    n(count(/^edited the description|^renamed /), "description or title edited", "descriptions or titles edited"),
  ].filter(Boolean);
  return `In the last 7 days ${who} made ${n(items.length, "change", "changes")}${parts.length ? `: ${parts.slice(0, -1).join(", ")}${parts.length > 1 ? " and " : ""}${parts[parts.length - 1]}` : ""}.`;
}
// AI summary from Task AI (only when this page runs inside the app). Waits until changes stop for a moment,
// then asks once per state of the activity; the result is kept so re-renders don't ask again.
function aiSummaryKey(items) { return `${state.id}|${items.length}|${items[0] ? items[0].at + items[0].text : ""}`; }
function requestAiSummary(items) {
  if (!location.pathname.startsWith("/close-plans") || !items.length) return;
  const key = aiSummaryKey(items);
  if (ui.aiSum && ui.aiSum.key === key) return;
  ui.aiSum = { key, text: null };
  clearTimeout(requestAiSummary.t);
  requestAiSummary.t = setTimeout(async () => {
    try {
      const r = await fetch("/api/close-plans/activity-summary", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ plan: state.title, items: items.map(a => ({ at: a.at, who: person(a.by).name, text: a.text })) }) });
      const data = await r.json().catch(() => ({}));
      if (!ui.aiSum || ui.aiSum.key !== key) return;
      ui.aiSum.text = r.ok && data.summary ? data.summary : "";
    } catch (e) { if (ui.aiSum && ui.aiSum.key === key) ui.aiSum.text = ""; }
    const box = document.getElementById("act-summary"); if (box) box.innerHTML = summaryHtml(items);
  }, 1500);
}
function summaryHtml(items) {
  const ai = ui.aiSum && ui.aiSum.key === aiSummaryKey(items) && ui.aiSum.text;
  const waiting = location.pathname.startsWith("/close-plans") && ui.aiSum && ui.aiSum.key === aiSummaryKey(items) && ui.aiSum.text === null;
  return `<span class="act-label">${ai ? "AI SUMMARY" : "SUMMARY"} · LAST 7 DAYS${waiting ? ` <i class="act-wait">updating…</i>` : ""}</span><p>${esc(ai || ruleSummary(items))}</p>`;
}
// Next up: what needs attention first, overdue before due soon (next 14 days), for whoever is viewing.
function nextUpPanel() {
  const today = isoOf(TODAY), soon = addDays(today, 14);
  const open = state.tasks.filter(t => visible(t) && t.status !== "Closed" && t.due && t.due <= soon).sort((a, b) => a.due.localeCompare(b.due));
  const shown = ui.nextAll ? open : open.slice(0, 6);
  const rel = due => { const n = daysBetween(today, due); return n < 0 ? `Overdue · ${fmt(due)}` : n === 0 ? "Due today" : n === 1 ? "Due tomorrow" : `Due ${fmt(due)} · in ${n} days`; };
  return `<section class="panel"><h3>Next up</h3>
    ${shown.length ? `<ul class="nextup">${shown.map(t => `<li><button type="button" class="nu-item" data-nu="${t.id}">${avatar(t.owner, "av-sm")}<span class="nu-body"><span class="nu-title">${esc(t.title)}</span><small class="${t.due < today ? "late" : ""}">${rel(t.due)} · ${esc(person(t.owner).name)}${parentOf(t) ? ` · in ${esc(parentOf(t).title)}` : ""}</small></span></button></li>`).join("")}</ul>` : `<p class="hint" style="margin:6px 0 0">Nothing overdue or due in the next two weeks.</p>`}
    ${open.length > 6 ? `<button type="button" class="act-toggle" data-nu-all aria-expanded="${Boolean(ui.nextAll)}"><span class="i i-chev chev"></span>${ui.nextAll ? "Show fewer" : `Show all ${open.length}`}</button>` : ""}
  </section>`;
}
// Major updates only in the default list; everything else (edits, assignments, small date moves) behind "Show all activity".
const MAJOR = /^closed “|^posted an update|^replied by email|^added “|^moved milestone|^added phase|^deleted phase|^invited |^re-sent the invitation|^added .+ to the .+ team|^removed .+ from the plan|^created this plan|^made .+ plan owner/;
function activityList(items) {
  const merged = [];
  for (const a of items) { const last = merged[merged.length - 1]; if (last && last.by === a.by && last.text === a.text && last.at === a.at) last.n++; else merged.push({ ...a, n: 1 }); }
  const dayLabel = at => at === isoOf(TODAY) ? "Today" : at === addDays(isoOf(TODAY), -1) ? "Yesterday" : fmtY(at);
  let list = "", lastDay = "";
  for (const a of merged) {
    if (a.at !== lastDay) { list += `<li class="act-day">${esc(dayLabel(a.at))}</li>`; lastDay = a.at; }
    list += `<li>${avatar(a.by)}<div><b>${esc(person(a.by).name)}</b> ${esc(a.text)}${a.n > 1 ? ` <span class="act-n">×${a.n}</span>` : ""}</div></li>`;
  }
  return `<ul class="feed">${list}</ul>`;
}
// Recent activity opens from a button in the header (it replaced the side column and "Next up"); a dot shows when something is new since the last look.
function activityDot() { const all = activityItems(); if (!all.length) return false; let seen = ""; try { seen = localStorage.getItem("cp-act-seen-" + state.id) || ""; } catch (e) {} return all[0].at > seen; }
function activityPanel() {
  const all = activityItems(), major = all.filter(a => MAJOR.test(a.text)).slice(0, 6), week = lastWeek(all);
  if (ui.actOpen) requestAiSummary(week);
  return `<section class="act-plain">
    ${major.length ? activityList(major) : `<p class="hint" style="margin:6px 0 0">No major updates yet.</p>`}
    ${all.length ? `<button type="button" class="act-toggle" data-act-toggle aria-expanded="${Boolean(ui.actOpen)}"><span class="i i-chev chev"></span>${ui.actOpen ? "Hide all activity" : `Show all activity (${all.length})`}</button>` : ""}
    ${ui.actOpen ? `<div class="act-all"><div class="act-summary" id="act-summary">${summaryHtml(week)}</div>${activityList(all)}</div>` : ""}
    ${ui.mode === "seller" ? `<p class="hint">When ${esc(B())} changes something, the task owner gets a Slack message or email, the same as any Task AI update.</p>` : ""}</section>`;

// ---------- Client PDF: a print-ready report of what the customer is allowed to see ----------
// Shown as a preview first; "Print / Save as PDF" uses the browser's print dialog (vector text, real page breaks).
// Only shared tasks are included: a task is left out when it, or its main task, is internal.
const sharedTask = t => t.shared && (!parentOf(t) || parentOf(t).shared);
const REPORT_PARTS = [["dates", "Key dates"], ["phases", "Phases"], ["next", "Next steps"], ["steps", "The plan, step by step"], ["people", "Who is involved"]];
const reportOpts = (() => { const o = { dates: true, phases: true, next: true, steps: true, people: true }; try { Object.assign(o, JSON.parse(localStorage.getItem("cp-report-parts") || "{}")); } catch (e) {} return o; })();
function reportHtml() {
  const tasks = state.tasks.filter(sharedTask);
  const today = isoOf(TODAY);
  const closed = tasks.filter(t => t.status === "Closed").length;
  const sign = tasks.find(t => t.key === "sign"), live = tasks.find(t => t.key === "live");
  const current = state.phases.filter(ph => today >= ph.start && today <= ph.end);
  const ms = tasks.filter(t => t.milestone && t.due).sort((a, b) => a.due.localeCompare(b.due));
  const nextMs = ms.find(t => t.status !== "Closed");
  const soon = addDays(today, 14);
  const next = tasks.filter(t => t.status !== "Closed" && t.due && t.due <= soon).sort((a, b) => a.due.localeCompare(b.due));
  const sellerOwner = person(state.planOwners.seller), buyerOwner = state.planOwners.buyer ? person(state.planOwners.buyer) : null;
  const statusTag = t => `<span class="r-status r-${statusClass(t.status) || "open"}">${esc(t.status)}</span>`;
  const dueTxt = t => t.status === "Closed" ? (t.closedAt ? `Done ${fmt(t.closedAt)}` : "Done") : !t.due ? "–" : t.due < today ? `<b class="r-late">Overdue · ${fmt(t.due)}</b>` : fmt(t.due);
  const who = ids => (ids || []).map(id => esc(person(id).name)).join(", ");
  const where = [
    current.length ? `We are in the ${current.map(p => p.name).join(" and ")} phase${current.length > 1 ? "s" : ""}.` : "",
    `${closed} of ${tasks.length} shared steps are done (${tasks.length ? Math.round(closed / tasks.length * 100) : 0}%).`,
    nextMs ? `The next milestone is ${nextMs.title} on ${fmtY(nextMs.due)}.` : "",
    sign ? `Signature is planned for ${fmtY(sign.due)}${live ? ` and go-live for ${fmtY(live.due)}` : ""}.` : "",
  ].filter(Boolean).join(" ");
  // Simple timeline: each phase as a bar on one shared date axis.
  const t0 = Math.min(...state.phases.map(p => d(p.start).getTime())), t1 = Math.max(...state.phases.map(p => d(p.end).getTime() + 864e5));
  const pos = iso => (d(iso).getTime() - t0) / (t1 - t0) * 100;
  const phaseRows = state.phases.map((p, i) => {
    const pt = tasks.filter(t => t.phase === p.id), pd = pt.filter(t => t.status === "Closed").length;
    return `<div class="r-tl-row"><span class="r-tl-name">${i + 1}. ${esc(p.name)}</span><span class="r-tl-lane"><i style="left:${pos(p.start)}%;width:${Math.max(pos(addDays(p.end, 1)) - pos(p.start), 1.5)}%"><b style="width:${pt.length ? pd / pt.length * 100 : 0}%"></b></i>${today >= p.start && today <= p.end ? "" : ""}</span><span class="r-tl-dates">${fmt(p.start)} – ${fmtY(p.end)}</span></div>`;
  }).join("");
  const todayMark = today >= isoOf(new Date(t0)) && today <= isoOf(new Date(t1)) ? `<span class="r-tl-today" style="left:calc(140px + (100% - 140px - 120px) * ${pos(today) / 100})"></span>` : "";
  const phaseSections = state.phases.map((p, i) => {
    const tops = tasks.filter(t => t.phase === p.id && !t.parent);
    if (!tops.length) return "";
    const rows = tops.map(t => {
      const subs = tasks.filter(k => k.parent === t.id);
      return `<tr class="r-task"><td>${statusTag(t)}</td><td><b>${esc(t.title)}</b>${t.milestone ? ` <span class="r-ms">◆ Milestone</span>` : ""}${t.desc ? `<div class="r-desc rt-view">${richOf(t.descHtml, t.desc)}</div>` : ""}</td><td>${esc(person(t.owner).name)}${(t.coworkers || []).length ? `<div class="r-sub">with ${who(t.coworkers)}</div>` : ""}</td><td>${(t.recipients || []).length ? who(t.recipients) : "–"}</td><td class="r-due">${dueTxt(t)}</td></tr>`
        + subs.map(k => `<tr class="r-subtask"><td>${statusTag(k)}</td><td>↳ ${esc(k.title)}</td><td>${esc(person(k.owner).name)}</td><td></td><td class="r-due">${dueTxt(k)}</td></tr>`).join("");
    }).join("");
    const inPhase = tasks.filter(k => k.phase === p.id), done = inPhase.filter(k => k.status === "Closed").length;
    return `<section class="r-phase"><div class="r-phase-head"><h3>${i + 1}. ${esc(p.name)} <span>${fmt(p.start)} – ${fmtY(p.end)}</span><em>${done}/${inPhase.length} closed</em></h3>${p.goal ? `<p class="r-goal">${esc(p.goal)}</p>` : ""}</div>
      <table class="r-table"><thead><tr><th>Status</th><th>Step</th><th>Owner</th><th>Requested by</th><th>Due</th></tr></thead><tbody>${rows}</tbody></table></section>`;
  }).join("");
  const team = side => {
    const ownerId = state.planOwners[side];
    const list = state.people.filter(p => p.side === side && !/Shared mailbox/.test(p.title || "")).sort((a, b) => (b.id === ownerId) - (a.id === ownerId));

      const detail = [title, p.role].filter(Boolean).map(esc).join(" · ");
      return `<li class="${p.id === ownerId ? "r-person-owner" : ""}"><b>${esc(p.name)}</b>${p.id === ownerId ? ` <span class="r-owner">Plan owner</span>` : ""}${detail ? `<small>${detail}</small>` : ""}</li>`;
    }).join("") || `<li class="r-none">Nobody added yet</li>`;
  };
  return `<article class="report">
    <header class="r-head">
      <div class="r-brand"><img class="r-logo-img" src="/iseeit-logo.png" alt="iSEEit" width="36" height="36"><span class="r-kind">Mutual close plan</span></div>
      <div class="r-meta">Prepared for <b>${esc(B())}</b> · ${fmtY(today)}</div>
    </header>
    <h1>${esc(state.title)}</h1>
    <div class="r-owners"><div><small>Plan owner ${esc(B())}</small><b>${buyerOwner ? esc(buyerOwner.name) : "not set"}</b></div><div><small>Plan owner iSEEit</small><b>${esc(sellerOwner.name)}</b></div></div>

    <section class="r-box"><h2>Where we stand</h2><p>${esc(where)}</p>
      <div class="r-kpis"><div><span>Progress</span><b>${tasks.length ? Math.round(closed / tasks.length * 100) : 0}%</b><small>${closed} of ${tasks.length} shared steps</small></div><div><span>Target signature</span><b>${sign ? fmtY(sign.due) : "–"}</b></div><div><span>Target go-live</span><b>${live ? fmtY(live.due) : "–"}</b></div><div><span>Next milestone</span><b>${nextMs ? `${esc(nextMs.title)}, ${fmt(nextMs.due)}` : "–"}</b></div></div>
    </section>

    ${reportOpts.dates && ms.length ? `<section><h2>Key dates</h2><table class="r-table r-compact"><thead><tr><th>Milestone</th><th>Date</th><th>Status</th></tr></thead><tbody>${ms.map(t => `<tr><td>◆ ${esc(t.title)}</td><td>${fmtY(t.due)}</td><td>${statusTag(t)}</td></tr>`).join("")}</tbody></table></section>` : ""}

    ${reportOpts.phases ? `<section><h2>Phases</h2><div class="r-tl">${phaseRows}${todayMark}</div></section>` : ""}

    ${reportOpts.next ? `<section><h2>Next steps</h2>${next.length ? `<table class="r-table r-compact"><thead><tr><th>Step</th><th>Owner</th><th>Due</th></tr></thead><tbody>${next.map(t => `<tr><td>${esc(t.title)}${parentOf(t) ? `<div class="r-sub">in ${esc(parentOf(t).title)}</div>` : ""}</td><td>${esc(person(t.owner).name)}</td><td class="r-due">${dueTxt(t)}</td></tr>`).join("")}</tbody></table>` : `<p class="r-goal">Nothing is due in the next two weeks.</p>`}</section>` : ""}

    ${reportOpts.steps ? `<h2 class="r-break">The plan, step by step</h2>
    ${phaseSections}` : ""}

    ${reportOpts.people ? `<section class="r-team"><h2>Who is involved</h2>
      <div class="r-cols"><div><h3>${esc(B())}</h3><ul class="r-people">${team("buyer")}</ul></div><div><h3>iSEEit</h3><ul class="r-people">${team("seller")}</ul></div></div>
    </section>` : ""}
    <footer class="r-foot">Generated from Task AI on ${fmtY(today)}. This report shows the shared plan; steps that are internal to iSEEit are neither shown nor counted. It is a snapshot and does not update.</footer>
  </article>`;
}
function openReport() {

      <div class="report-opts"><span>Include</span><label class="ro-fixed"><input type="checkbox" checked disabled> Where we stand</label>${REPORT_PARTS.map(([k, name]) => `<label><input type="checkbox" data-rpart="${k}" ${reportOpts[k] ? "checked" : ""}> ${name}</label>`).join("")}</div></div>

  </div></div>`;

  });
  root.querySelector("[data-rclose]").onclick = close;
  root.querySelector("[data-rclose-bg]").onclick = e => { if (e.target === e.currentTarget) close(); };
  root.querySelector("[data-rprint]").onclick = () => {
    // The page title becomes the suggested PDF file name.
    const old = document.title;
    document.title = `Close plan – ${B()} – ${isoOf(TODAY)}`;
    window.addEventListener("afterprint", () => { document.title = old; }, { once: true });

}

// ---------- Access log signals and "Last seen" (app/lib/close-plan-access-log.ts) ----------
// The server logs logins, link visits, files and saves itself; the page only reports which plan or task was opened.
// Admins read the log under Admin → Close Plan activity.
const trackOn = () => state && !state._demo && (IN_APP || LINK);
function track(event, taskId) {
  if (!trackOn()) return;
  const url = LINK ? `/api/close-plans/shared/${encodeURIComponent(LINK_TOKEN)}/events` : `/api/close-plans/store/${encodeURIComponent(state.id)}/events`;

let pdfJsLoading = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return pdfJsLoading || (pdfJsLoading = new Promise((ok, fail) => {
    const s = document.createElement("script"); s.src = "/pdfjs/pdf.min.js";
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "/pdfjs/pdf.worker.min.js"; ok(window.pdfjsLib); };
    s.onerror = () => { pdfJsLoading = null; fail(new Error("viewer")); };
    document.head.appendChild(s);
  }));
}
async function openPdfViewer(a) {
  const url = `${attBase()}/${encodeURIComponent(a.id)}`;
  const host = document.createElement("div"); host.className = "pv-overlay";
  host.innerHTML = `<div class="pv" role="dialog" aria-modal="true" aria-label="${esc(a.name)}"><div class="pv-bar"><b>${esc(a.name)}</b><span class="pv-pg" aria-live="polite"></span>
    <button type="button" data-pv-out aria-label="Zoom out">−</button><button type="button" data-pv-in aria-label="Zoom in">+</button><a href="${url}" download>Download</a><button type="button" data-pv-close>Close</button></div>
    <div class="pv-body"><p class="pv-msg">Loading…</p></div></div>`;
  document.body.appendChild(host);
  const body = host.querySelector(".pv-body"), pg = host.querySelector(".pv-pg");
  let zoom = 1, token = 0, doc = null;
  const close = () => { token++; document.removeEventListener("keydown", onKey, true); host.remove(); if (doc) doc.destroy(); };
  const onKey = e => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  document.addEventListener("keydown", onKey, true);
  host.onclick = e => { if (e.target === host) close(); };
  host.querySelector("[data-pv-close]").onclick = close;
  async function draw() {
    const mine = ++token; body.innerHTML = "";
    const pages = Math.min(doc.numPages, 300), width = Math.max(240, body.clientWidth - 28);
    for (let i = 1; i <= pages; i++) {
      if (mine !== token) return;
      const page = await doc.getPage(i), base = page.getViewport({ scale: 1 }), scale = (width / base.width) * zoom, vp = page.getViewport({ scale }), dpr = window.devicePixelRatio || 1;
      const c = document.createElement("canvas"); c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr); c.style.width = `${Math.floor(vp.width)}px`; c.style.height = `${Math.floor(vp.height)}px`;
      c.setAttribute("aria-label", `Page ${i} of ${doc.numPages}`); body.appendChild(c);
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
      pg.textContent = `${doc.numPages} page${doc.numPages === 1 ? "" : "s"}`;
    }
  }
  host.querySelector("[data-pv-in]").onclick = () => { zoom = Math.min(3, zoom + 0.25); draw(); };
  host.querySelector("[data-pv-out]").onclick = () => { zoom = Math.max(0.5, zoom - 0.25); draw(); };
  try {
    const lib = await loadPdfJs();
    const res = await fetch(`${url}?view=1`, { credentials: "same-origin" });
    if (!res.ok) throw new Error("file");
    doc = await lib.getDocument({ data: new Uint8Array(await res.arrayBuffer()), isEvalSupported: false, enableXfa: false }).promise;
    if (!host.isConnected) { doc.destroy(); return; }
    await draw();
  } catch (e) { if (host.isConnected) body.innerHTML = `<p class="pv-msg">This file can't be shown here. Use Download to open it.</p>`; }
}

// Weekly digest (Monday). At most one email per person per plan:
// - each side's plan owner gets the plan overview plus their own tasks;
// - other Meridian Biotech contacts get only their own tasks (owner/coworker, tracking), and nothing if nothing is open;
// - other iSEEit people already get these tasks in their regular Task AI digest, so no extra email.

function digestFor(id) {
  const p = person(id), canSee = seenBy(id);

  const byDue = (a, b) => (a.due || "9999").localeCompare(b.due || "9999");
  const mine = open.filter(t => t.owner === id || (t.coworkers || []).includes(id)).sort(byDue);
  const tracking = open.filter(t => t.owner !== id && !(t.coworkers || []).includes(id) && (t.recipients || []).includes(id)).sort(byDue);

  else if (!p.email) { kind = null; reason = "No email address"; }
  else if (!p.invite || p.invite.status === "none") { kind = null; reason = "Not invited yet"; }
  else if (!mine.length && !tracking.length) { kind = null; reason = "Nothing open: no email this week"; }

  const weekAgo = new Date(TODAY); weekAgo.setDate(weekAgo.getDate() - 7);
  const all = state.tasks.filter(canSee);
  const mineSet = new Set([...mine, ...tracking].map(t => t.id));
  const others = t => !mineSet.has(t.id);
  return {
    p, kind, reason, mine, tracking,
    overdue: open.filter(isOverdueT).sort(byDue),
    overdueOthers: open.filter(t => isOverdueT(t) && others(t)).sort(byDue),
    dueSoon: open.filter(t => !isOverdueT(t) && t.due && d(t.due) <= soon && others(t)).sort(byDue),
    closedWeek: all.filter(t => t.status === "Closed" && t.closedAt && d(t.closedAt) >= weekAgo),
    msMoves: all.filter(t => t.milestone && recentMove(t, 7)).map(t => ({ t, c: recentMove(t, 7) })),

// Task AI's manual notify email for one task: its reply-to is a personal reply+token address,
// so whatever the contact writes back is posted on the task (and a status change in the reply is picked up).
function renderAsk() {
  const root = $("#digest-root");
  if (!ui.ask) { root.innerHTML = ""; return; }
  const t = state.tasks.find(x => x.id === ui.ask.task), p = person(ui.ask.who), first = p.name.split(" ")[0];
  const from = person(me());
  const replyTo = `reply+${(t.id + p.id + "7f3a9c").replace(/[^a-z0-9]/gi, "").toLowerCase()}@tasks.iseeit.ai`;
  root.innerHTML = `<div class="overlay em-overlay" data-aclose-bg><div class="em-modal" role="dialog" aria-modal="true" aria-label="Ask for an update">

    <div style="padding:16px 22px;border-bottom:1px solid var(--line)"><label class="field" style="display:flex">Your note<textarea id="ask-msg" data-grow style="border:1px solid var(--field);border-radius:8px;padding:10px 12px;min-height:70px;font-weight:400;font-size:14px;resize:vertical">Hi ${esc(first)}, could you give us a quick update on this? Just reply to this email.</textarea></label>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap">${ui.ask.sent ? `<button type="button" class="btn sm" id="ask-reply">Simulate ${esc(first)}’s reply</button>` : ""}<button type="button" class="btn sm primary" id="ask-send" ${ui.ask.sent ? "disabled" : ""}>${ui.ask.sent ? "Sent" : "Send email"}</button></div></div>
    <div class="em-page"><div class="em-mail">
      <div class="em-head"><span class="em-logo">Task</span> <span class="em-ai">AI</span></div>
      <div class="em-body">
        <div class="em-hi">Hi ${esc(first)},</div>
        <p id="ask-preview" style="color:#202735;font-size:14px;line-height:1.55;white-space:pre-wrap;margin:10px 0 4px"></p>
        <div style="color:#5b6577;font-size:13px">— ${esc(from.name)}, iSEEit</div>
        <h4 class="em-h">The task</h4>${emailCard(t, p.id)}
        <span class="em-cta">Open the plan</span><span class="em-cta em-cta-2">Reply via Email</span>
        <p class="em-foot" style="margin-top:14px">Or simply hit reply on this email to send your update.</p>
      </div></div></div>
  </div></div>`;
  growAll(root);
  const msg = $("#ask-msg"), prev = $("#ask-preview");
  const sync = () => prev.textContent = msg.value.replace(/^Hi [^,]+,\s*/, "");
  msg.oninput = sync; sync();
  const close = () => { ui.ask = null; renderAsk(); };
  root.querySelector("[data-aclose]").onclick = close;
  root.querySelector("[data-aclose-bg]").onclick = e => { if (e.target === e.currentTarget) close(); };
  $("#ask-send").onclick = () => { log(`asked ${p.name} for an update on “${t.title}” by email`, t.id); save(); ui.ask.sent = true; renderAsk(); toast(`Sent. ${first}’s reply will be posted on the task`); };
  const r = $("#ask-reply"); if (r) r.onclick = () => {
    const text = "Working on it now, you'll have it by Friday.";
    ui.viewerBackup = null;
    t.updates.push({ by: p.id, at: new Date().toISOString().slice(0, 10), text, viaEmail: true });
    state.activity.unshift({ at: new Date().toISOString().slice(0, 10), by: p.id, text: `replied by email on “${t.title}”`, task: t.id });
    startWork(t, p.id);
    save(); ui.ask = null; renderAsk(); render(); toast(`${first}’s reply was posted. Status read from the reply: ${t.status}`);
  };
}

// Floating tooltip for milestone diamonds, placed above the diamond and kept inside the window.
function showTip(m) {
  const tpl = m.querySelector(".ms-tip"); if (!tpl) return;
  let tip = document.getElementById("float-tip");
  if (!tip) { tip = document.createElement("div"); tip.id = "float-tip"; tip.className = "float-tip"; tip.setAttribute("role", "tooltip"); document.body.appendChild(tip); }
  tip.innerHTML = tpl.innerHTML; tip.hidden = false;
  const r = m.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
  tip.style.top = (r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8) + "px";
}
function hideTip() { const tip = document.getElementById("float-tip"); if (tip) tip.hidden = true; }
window.addEventListener("scroll", hideTip, { passive: true });
window.addEventListener("scroll", () => { const f = document.querySelector(".vx-fab"); if (f) f.classList.toggle("show", window.scrollY > 240); }, { passive: true });

// Site Admins: opens this plan's close plan in Salesforce (the Playground), no opportunity ID to copy. The
// opportunity is stored on plans created from Sales AI; for older plans it's looked up by name and then kept.
async function openSalesforcePlan() {
  ui.planMenu = false; render();
  try {
    await flushPlanSave();
    const r = await fetch(`/api/close-plans/store/${encodeURIComponent(state.id)}/opportunity`, { credentials: "same-origin" });
    const res = await r.json().catch(() => ({}));
    if (!r.ok) { toast(res.error || "Couldn't look up the Salesforce opportunity."); return; }
    if (!res.opportunityId) { toast(res.error || "No Salesforce opportunity found for this plan. Search for it in the Playground."); window.open("/playground", "_blank", "noopener"); return; }
    if (state.sfdcOpportunityId !== res.opportunityId) { state.sfdcOpportunityId = res.opportunityId; save(); }
    const url = `/playground?opportunityId=${encodeURIComponent(res.opportunityId)}`;
    if (!window.open(url, "_blank", "noopener")) location.href = url;
  } catch (e) { toast("Couldn't look up the Salesforce opportunity. Check your connection."); }
}

// Adds people to one side of the plan, each with a role. Plan owners and administrators only (canManage).
function addPeopleToPlan(list, side) {
  if (!canAddPeople(side)) { toast("Only people on the iSEEit team can add people"); return; }
  const added = [];
  for (const np of list) {
    if (onPlan(np)) continue;
    const id = "p" + (++state.seq);
    state.people.push({ id, name: np.name, email: np.email || "", title: np.title || "", role: np.role || "", side, ...(np.contactIds && np.contactIds.length ? { contactIds: np.contactIds } : {}),
      access: { ...ACCESS_DEFAULTS[side] }, invite: side === "seller" ? { status: "member" } : { status: "none" } });
    log(`added ${np.name} to the ${side === "buyer" ? B() : "iSEEit"} team${np.role ? ` as ${np.role}` : ""}`, null);
    added.push(np);
  }
  ui.addFor = null; save(); render();
  if (added.length) toast(added.length === 1 ? `${added[0].name} added${added[0].role ? ` as ${added[0].role}` : ""}${side === "buyer" ? ". Copy their personal link when you're ready" : ""}` : `${added.length} people added${side === "buyer" ? ". Copy their personal links when you're ready" : ""}`);
}

const usingAppUsers = () => Boolean(APP_USERS && APP_USERS.length);

const isoOf = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
const addDays = (iso, n) => { const x = d(iso); x.setDate(x.getDate() + n); return isoOf(x); };
// Template dates are fitted into the real timeframe (plan start → signature → go-live). Each template date is a
// day number on the template's own scale: signature = 0, go-live = tpl.live (its typical gap). Days before
// signature are stretched or squeezed between the plan start and the signature date, days between signature and
// go-live between those two dates, and days after go-live keep their distance (e.g. a 30-day adoption review).
const daysBetween = (a, b) => Math.round((d(b) - d(a)) / 864e5);

const tplDay = (tpl, [anchor, off]) => anchor === "G" ? (tpl.live || 45) + off : off;
const tplEarliest = tpl => Math.min(0, ...tpl.phases.flatMap(p => [p[3], p[4]]).concat(tpl.tasks.flatMap(t => [t[3], ...(((t[4] || {}).subs) || []).map(x => x[2])])).map(x => tplDay(tpl, x)));

  if (t <= live) return addDays(w.sign, Math.round(t / live * daysBetween(w.sign, w.live)));

}
const tplRoles = tpl => {
  const used = new Map();

  tpl.tasks.forEach(([, , role, , o = {}]) => { add(role); (o.co || []).forEach(r => add(r)); (o.rq || []).forEach(r => add(r)); (o.subs || []).forEach(([, sr, , so = {}]) => { add(sr); (so.co || []).forEach(r => add(r)); }); });

const tplCount = tpl => tpl.tasks.reduce((n, t) => n + 1 + ((t[4] || {}).subs || []).length, 0);

async function runSearch() {

      const r = await fetch(`/api/close-plans/opportunities?q=${encodeURIComponent(q)}`, { credentials: "same-origin" });
      const data = await r.json().catch(() => ({}));
      if (seq !== w.searchSeq) return;
      if (r.status === 401 || r.status === 403) { w.liveOff = data.error || "Live Sales AI search isn't available for your account."; }
      else if (!r.ok) { w.searchErr = data.error || "Sales AI is not reachable right now."; w.hits = []; }

// Replace one person id everywhere in a plan (tasks, updates, activity, plan owners).
function remapPerson(plan, from, to) {

// Someone not yet on the plan (e.g. a Site Admin) who changes it is added to the iSEEit team on their first change.
function materializeMe(plan) {

  if (!plan.people.some(p => p.id === ME_ID())) plan.people.push({ ...creatorPerson(), role: "", access: { ...ACCESS_DEFAULTS.seller }, invite: { status: "member" } });

const cleanPlan = plan => { const { _v, _demo, _base, _rebases, ...data } = plan; return data; };

// out of the field, often onto a menu link), send it now instead of losing it.
function flushOnLeave() { if (!IN_APP || !state || state._demo) return; for (const id of Object.keys(sync.timers)) { if (sync.timers[id]) { clearTimeout(sync.timers[id]); sync.timers[id] = null; const plan = store.plans.find(p => p.id === id); if (plan) pushPlan(plan); } } }
window.addEventListener("pagehide", flushOnLeave);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushOnLeave(); });
function setSaveState(text, bad = false) { const el = document.getElementById("save-state"); if (el) { el.textContent = text; el.classList.toggle("bad", bad); } }
function queueSave(plan) {

  sync.dirty[plan.id] = true; setSaveState("Saving…");
  sync.timers[plan.id] = setTimeout(() => pushPlan(plan), 600);
}
async function pushPlan(plan) {
  if (sync.inflight[plan.id]) { sync.dirty[plan.id] = true; return; }
  sync.inflight[plan.id] = true; sync.dirty[plan.id] = false;
  try {
    // keepalive lets the request finish even if the person leaves the page right after the change (it only accepts bodies under 64 KB).
    const sent = cleanPlan(plan), sentJson = JSON.stringify(sent);
    const body = JSON.stringify({ version: plan._v || 0, data: sent });
    const r = await fetch(`/api/close-plans/store/${encodeURIComponent(plan.id)}`, { method: "PUT", credentials: "same-origin", headers: { "content-type": "application/json" }, body, keepalive: body.length < 60000 });
    const res = await r.json().catch(() => ({}));
    if (r.ok) { plan._v = res.version; plan._base = sentJson; plan._rebases = 0; setSaveState("Saved"); if (state && state.id === plan.id) sfAutoSoon(); }
    else if (r.status === 409 && res.plan) {

        // The server has a newer version (the Salesforce sync or a colleague saved first): keep what the person changed, take
        // everything else from the newer version, and send that.

        sync.dirty[plan.id] = true; setSaveState("Saving…"); if (state && state.id === plan.id) render();
      } else {
        const fresh = fromServerData(res.plan.data, res.plan.version);
        store.plans = store.plans.map(p => p.id === fresh.id ? fresh : p);
        if (state && state.id === fresh.id) state = fresh;
        sync.dirty[plan.id] = false; render();
        toast("Someone else changed this plan at the same time. You now see their latest version; please redo your last change.");
      }

  } catch (e) { setSaveState("Not saved", true); toast("The plan could not be saved. Check your connection."); }
  sync.inflight[plan.id] = false;

}
async function fetchStore() {

async function bootFromServer() {

    state = store.plans.find(p => p.id === last) || store.plans[0] || null;

    ui.uploadOffer = ((load() || {}).plans || []).filter(p => /^pl\d/.test(p.id) && !serverIds.has(p.id) && !uploaded.includes(p.id));

async function pollStore() {
  if (!IN_APP || document.hidden || ui.loading || ui.wizard) return;
  if (Object.values(sync.inflight).some(Boolean) || Object.values(sync.dirty).some(Boolean)) return;
  const a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  try {
    const data = await fetchStore();
    const byId = new Map(data.plans.map(p => [p.id, p]));
    let changed = false;
    const next = data.plans.map(p => { const local = store.plans.find(x => x.id === p.id); if (local && local._v === p.version) return local; changed = true; return fromServerData(p.data, p.version); });
    if (store.plans.some(p => !p._demo && !byId.has(p.id))) changed = true;
    if (!changed) return;
    const demo = store.plans.filter(p => p._demo);
    store.plans = [...next, ...demo];
    state = (state && store.plans.find(p => p.id === state.id)) || store.plans[0] || null;
    render();
  } catch (e) {}
}
async function uploadLocalPlans() {
  const plans = ui.uploadOffer || []; let ok = 0;
  let uploaded = []; try { uploaded = JSON.parse(localStorage.getItem(STORE_KEY + ":uploaded") || "[]"); } catch (e) {}
  for (const local of plans) {
    const plan = JSON.parse(JSON.stringify(local));
    // In the browser-only version "rf" always meant "me": the person who created the plan.
    const mine = plan.people.find(p => p.side === "seller" && lowerEmail(p.email) === lowerEmail(APP_ME.email));
    if (plan.people.some(p => p.id === "rf")) {
      const target = mine && mine.id !== "rf" ? mine.id : ME_ID();
      if (target !== ME_ID()) plan.people = plan.people.filter(p => p.id !== "rf");
      else plan.people = plan.people.filter(p => p.id !== ME_ID() || p.id === "rf").map(p => p.id === "rf" ? { ...p, id: ME_ID(), name: APP_ME.name, email: APP_ME.email } : p);

    try {
      const r = await fetch(`/api/close-plans/store/${encodeURIComponent(plan.id)}`, { method: "PUT", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ version: 0, data: plan }) });
      const res = await r.json().catch(() => ({}));

      else toast(res.error || `“${plan.title}” could not be uploaded`);
    } catch (e) { toast(`“${plan.title}” could not be uploaded`); }

  ui.uploadOffer = null;
  if (ok) { state = store.plans[store.plans.length - 1]; store.current = state.id; toast(`${ok} plan${ok > 1 ? "s" : ""} uploaded. Your team can now see ${ok > 1 ? "them" : "it"}.`); }
  render();
}

    moved.push(x.title);

$("#mode-buyer").onclick = () => { ui.mode = "buyer"; ui.open = null; ui.filter = "all"; ui.addFor = null; ui.removing = null; try { localStorage.setItem(STORE_KEY + ":mode", "buyer"); } catch (e) {} render(); };
if (IN_APP) $("#reset").hidden = true;
$("#reset").onclick = () => { store = freshStore(); state = store.plans[0]; ui.wizard = null; ui.open = null; ui.expanded = new Set(); save(); render(); toast("Demo data reset"); };
document.addEventListener("click", e => {
  if ((ui.phaseMenu || ui.planMenu) && !e.target.closest(".ph-tools")) { ui.phaseMenu = null; ui.planMenu = false; render(); }
  if (ui.picker && !e.target.closest(".pfield")) { ui.picker = null; render(); }
  if (ui.photoMenu && !e.target.closest(".pphoto")) { ui.photoMenu = null; render(); }
});
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (ui.photoMenu) { ui.photoMenu = null; render(); return; } if (ui.shareAll) { ui.shareAll = null; renderShareAll(); return; } if (ui.notify) { ui.notify = null; renderNotify(); return; } if (ui.phaseMenu) { ui.phaseMenu = null; render(); return; } if (ui.inviteFor) { ui.inviteFor = null; renderInvite(); } else if (ui.digestFor && ui.manage) { ui.digestFor = null; renderDigest(); } else if (ui.manage) { ui.manage = null; ui.removing = null; renderManage(); } else if (ui.ask) { ui.ask = null; renderAsk(); } else if (ui.digestFor) { ui.digestFor = null; renderDigest(); } else if (ui.open) closeDrawer(); });
if (state) ui.expanded.add(state.tasks.find(t => t.title === "Proof of concept")?.id);
loadAppUsers();
if (LINK) { store = { plans: [], current: null }; state = null; ui.loading = true; render(); bootFromLink(); }
else if (IN_APP) { ui.loading = true; render(); bootFromServer(); } else render();
</script>
