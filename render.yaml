databases:
  - name: tasks-ai-db-frankfurt
    plan: basic-256mb
    region: frankfurt
    databaseName: tasks_ai
    user: tasks_ai
services:
  - type: web
    name: tasks-ai
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --global pnpm@11.19.0 && pnpm install --frozen-lockfile && pnpm run build
    startCommand: node scripts/start.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: tasks-ai-db-frankfurt
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Used for links inside outgoing emails (invitations, sign-in links,
      # "Open Task AI" buttons) — see appLinkOrigin/appLinkUrl in
      # app/lib/request.ts. Currently the Render URL, not tasks.flenner.at:
      # that custom domain's DNS is blocked by an MX record on the same
      # `tasks` host (needed for inbound mail on another app) that conflicts
      # with the CNAME the site needs. Revisit once that's resolved, e.g. via
      # a different subdomain for the app.
      - key: APP_URL
        value: https://tasks-ai.onrender.com
      - key: TASK_AI_FROM_EMAIL
        value: Task AI <notifications@tasks.flenner.at>
      - key: SITE_ADMIN_EMAIL
        value: rizan@flenner.at
      - key: SITE_ADMIN_FIRST_NAME
        value: Rizan
      - key: SITE_ADMIN_LAST_NAME
        value: Flenner
      - key: SITE_ADMIN_COMPANY
        sync: false
      - key: BOOTSTRAP_SITE_ADMIN
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      # Set manually in the Render dashboard once a Deepgram account exists —
      # only used by the /voice-test comparison page (app/api/voice-test-
      # deepgram) to A/B transcription against OpenAI's Whisper-1. Not on
      # the critical path for anything else yet.
      - key: DEEPGRAM_API_KEY
        sync: false
      # OAuth client from Google Cloud Console → APIs & Services →
      # Credentials — Web application type, with
      # https://tasks-ai.onrender.com/api/auth/google/callback registered as
      # an authorized redirect URI. "Continue with Google" on /login is a
      # second way in for an *existing* account (same invite-only rule as
      # the email/code login) — it never creates a new one.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
  - type: cron
    name: tasks-ai-weekly-reminders
    runtime: node
    plan: starter
    region: frankfurt
    # Monday, 05:00 UTC = 07:00 Europe/Vienna during CEST (summer). Render
    # cron schedules are fixed UTC and do not shift for daylight saving —
    # once CET (winter, UTC+1) resumes this will fire at 06:00 local instead
    # of 07:00. Adjust the hour by hand around the DST changeovers if the
    # exact local time matters, or move to 06:00 UTC for a winter-correct
    # 07:00. Was daily (tasks-ai-daily-reminders) — moved to weekly once
    # overdue tasks got their own, more frequent nudge below instead.
    schedule: "0 5 * * 1"
    buildCommand: npm install --global pnpm@11.19.0 && pnpm install --frozen-lockfile
    startCommand: node --import tsx scripts/send-weekly-reminders.ts
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: tasks-ai-db-frankfurt
          property: connectionString
      - key: APP_URL
        value: https://tasks-ai.onrender.com
      - key: TASK_AI_FROM_EMAIL
        value: Task AI <notifications@tasks.flenner.at>
      - key: RESEND_API_KEY
        sync: false
  - type: cron
    name: tasks-ai-overdue-nudges
    runtime: node
    plan: starter
    region: frankfurt
    # Every 2 days, 05:00 UTC — see the comment in
    # scripts/send-overdue-nudges.ts for why this isn't perfectly exact
    # across month boundaries (Render cron has no native "every N days").
    schedule: "0 5 */2 * *"
    buildCommand: npm install --global pnpm@11.19.0 && pnpm install --frozen-lockfile
    startCommand: node --import tsx scripts/send-overdue-nudges.ts
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: tasks-ai-db-frankfurt
          property: connectionString
      - key: APP_URL
        value: https://tasks-ai.onrender.com
      - key: TASK_AI_FROM_EMAIL
        value: Task AI <notifications@tasks.flenner.at>
      - key: RESEND_API_KEY
        sync: false
